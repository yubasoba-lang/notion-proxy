
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070810">
<title>GRIND</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Ma+Shan+Zheng&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #000000;
  --bg-card:   #0c0c0c;
  --bg-mid:    #111111;
  --bg-hi:     #181818;
  --border:    #1e1e1e;
  --border-hi: #2a2a2a;
  --border-glow: #333333;
  --text:      #a8a8a8;
  --text-dim:  #505050;
  --text-faint:#202020;
  --gold:      #a8a8a8;
  --gold-hi:   #c0c0c0;
  --gold-dim:  #3a3a3e;
  --gold-glow: rgba(232,234,240,0.06);
  --green:     #0a0a0a;
  --green-hi:  #111118;
  --green-text:#6ab187;
  --red-text:  #b91c1c;
  --red-hi:    #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

/* Ambient glow orbs */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(ellipse 60% 50% at 15% 20%,  rgba(232,234,240,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 55% at 88% 78%,  rgba(232,234,240,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 40% 45% at 50% 50%,  rgba(232,234,240,0.025) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
  animation: orb-breathe 14s ease-in-out infinite alternate;
}
@keyframes orb-breathe {
  0%   { opacity: 0.6; }
  50%  { opacity: 1; }
  100% { opacity: 0.7; }
}
body::after { display: none; }

#app { max-width: 430px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }

/* ── Player title ── */
.player-title { display:flex; align-items:baseline; gap:5px; cursor:pointer; margin-top:3px; min-height:14px; }
.player-title:active { opacity:0.7; }
.title-sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:600; display:flex; align-items:flex-end; justify-content:center; animation:fade-in 0.15s ease; }
.title-sheet { background:var(--bg-card); border:1px solid var(--border-hi); border-radius:4px 4px 0 0; padding:28px 24px 44px; width:100%; max-width:430px; }
.title-sheet-big { text-align:center; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:6px; }
.title-sheet-meta { text-align:center; font-size:9px; color:var(--text-dim); letter-spacing:0.10em; margin-bottom:18px; }
.title-sheet-why { font-size:12px; color:var(--text); line-height:1.6; text-align:center; margin-bottom:24px; padding:0 4px; }
.title-sheet-close { width:100%; padding:13px; background:transparent; border:1px solid var(--border-hi); color:var(--text-dim); border-radius:8px; font-size:10px; letter-spacing:0.12em; cursor:pointer; text-transform:uppercase; font-family:'Inter',sans-serif; }

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 12px;
  background: rgba(12,12,15,0.98);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}
.wordmark { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 0.28em; text-shadow: 0 0 24px rgba(232,234,240,0.15); }
.wordmark em { color: var(--gold); font-style: normal; }
.sync-btn {
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-dim);
  font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
  padding: 5px 12px; cursor: pointer; border-radius: 3px;
  transition: all 0.25s; text-transform: uppercase;
  font-family: 'Inter', sans-serif;
}
.sync-btn:hover { color: var(--gold); border-color: var(--gold-dim); }
.sync-btn:disabled { opacity: 0.25; cursor: not-allowed; }

/* ── Nav ── */
.nav {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: rgba(6,6,12,0.99);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.nav-btn {
  display: flex; align-items: center; justify-content: center;
  padding: 12px 4px; background: none; border: none; cursor: pointer;
  color: var(--text-dim); transition: all 0.2s; position: relative;
}
.nav-btn.active { color: var(--gold); }
.nav-btn.active::after {
  content: ''; position: absolute; bottom: 0; left: 30%; right: 30%;
  height: 2px; background: var(--gold);
  box-shadow: 0 0 12px rgba(232,234,240,0.5);
}
.nav-icon { font-size: 16px; line-height: 1; }

.scroll { flex: 1; overflow-y: auto; padding: 16px 16px 100px; -webkit-overflow-scrolling: touch; }
.nav-label { display: none; }
.sidebar { display: contents; }

/* ── Calendar card ── */
.cal-card { background: rgba(16,16,20,0.8); border: 1px solid rgba(232,234,240,0.09); border-radius: 3px; padding: 16px; transition: border-color 0.2s; }
.cal-card:hover { border-color: rgba(232,234,240,0.16); }
.cal-month { font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-hdr { font-size: 7px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); text-align: center; padding: 3px 0 5px; }
.cal-cell { position: relative; aspect-ratio: 1; border: 1px solid transparent; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 3px 2px 2px; min-height: 32px; }
.cal-cell.today { border-color: rgba(232,234,240,0.35) !important; }
.cal-cell.has-exam { border-color: rgba(200,80,80,0.45) !important; }
.cal-dn { font-size: 9px; font-weight: 600; color: var(--text-dim); line-height: 1; }
.cal-cell.today .cal-dn { color: var(--gold); }
.cal-cell.past .cal-dn { opacity: 0.4; }
.cal-wdot { width: 4px; height: 4px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
.cal-exam-lbl { font-size: 5.5px; font-weight: 700; text-transform: uppercase; color: rgba(210,100,100,0.95); letter-spacing: 0.04em; text-align: center; line-height: 1.2; margin-top: 1px; width: 100%; overflow: hidden; }
.cal-legend { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 7px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); }
.cal-ldot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ── Desktop / Landscape Dashboard ── */
@media (min-width: 900px) {
  #app {
    flex-direction: row;
    max-width: 100%;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    width: 220px;
    flex-shrink: 0;
    height: 100vh;
    position: sticky;
    top: 0;
    background: rgba(6,6,12,0.99);
    border-right: 1px solid var(--border);
  }
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 18px 16px;
    flex-shrink: 0;
  }
  .nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    grid-template-columns: unset;
    border-bottom: none;
    padding: 10px 0;
    overflow-y: auto;
  }
  .nav-btn {
    justify-content: flex-start;
    padding: 11px 16px;
    gap: 11px;
    border-radius: 7px;
    margin: 1px 10px;
  }
  .nav-btn.active::after { display: none; }
  .nav-btn.active { background: rgba(232,234,240,0.07); border-left: 2px solid var(--gold); padding-left: 14px; }
  .nav-icon { font-size: 15px; }
  .nav-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
  }
  .scroll {
    flex: 1;
    height: 100vh;
    padding: 28px 48px 60px;
    max-width: none;
  }
  .tab-panel { max-width: 720px; margin: 0 auto; }
  /* Sidebar header: stack wordmark and buttons vertically */
  .header { flex-direction: column; align-items: flex-start !important; gap: 12px; }
  .header > div:last-child { align-items: flex-start !important; width: 100%; }
  .header > div:last-child > div:first-child { flex-wrap: wrap; }
  /* Home 2-column grid */
  .home-desktop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .home-col-full { grid-column: 1 / -1; }
  .home-col-left, .home-col-right { display: flex; flex-direction: column; gap: 14px; }
  /* Sidebar clock */
  .sidebar-clock { display: flex; flex-direction: column; padding: 14px 18px 10px; border-top: 1px solid var(--border); margin-top: auto; }
  .sidebar-clock-time { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.06em; color: var(--gold); opacity: 0.85; line-height: 1; }
  .sidebar-clock-date { font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }
  /* Sidebar active session pill */
  .sidebar-session { padding: 10px 14px; margin: 0 10px 8px; background: rgba(232,234,240,0.06); border: 1px solid rgba(232,234,240,0.12); border-radius: 8px; cursor: pointer; }
  .sidebar-session-label { font-size: 7px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .sidebar-session-timer { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.08em; color: var(--gold); line-height: 1; }
  .sidebar-session-subject { font-size: 9px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Command palette */
  #cmd-palette-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; padding-top: 120px; }
  #cmd-palette { background: #13130f; border: 1px solid rgba(232,234,240,0.18); border-radius: 3px; width: 520px; max-width: 92vw; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,234,240,0.06); }
  #cmd-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif; padding: 16px 20px; outline: none; letter-spacing: 0.02em; }
  #cmd-input::placeholder { color: var(--text-faint); }
  .cmd-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; cursor: pointer; transition: background 0.12s; font-size: 12px; letter-spacing: 0.04em; color: var(--text-dim); }
  .cmd-item:hover, .cmd-item.selected { background: rgba(232,234,240,0.07); color: var(--text); }
  .cmd-item-icon { font-size: 14px; width: 20px; text-align: center; opacity: 0.7; }
  .cmd-item-hint { margin-left: auto; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); }
  /* Rival page — don't cover sidebar */
  .rival-page { left: 220px; }
  .rival-page-inner { max-width: 860px; padding: 0 40px 60px; }
  /* Glassmorphism cards on desktop */
  .study-widget, .focus-card, .recap-card, .next-exam-card {
    background: rgba(16,16,20,0.8);
    border: 1px solid rgba(232,234,240,0.09);
    transition: border-color 0.2s;
  }
  .study-widget:hover, .focus-card:hover, .recap-card:hover, .next-exam-card:hover {
    border-color: rgba(232,234,240,0.16);
  }
}

/* ── Loader ── */
.loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 20px; gap: 14px; }
.loader-ring { width: 32px; height: 32px; border: 1.5px solid var(--border-hi); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase; }

.error-bar { background: rgba(138,48,48,0.1); border: 1px solid rgba(138,48,48,0.2); border-radius: 4px; color: #a05050; padding: 10px 12px; font-size: 11px; margin-bottom: 10px; line-height: 1.5; }

/* ── Section label ── */
.section-label {
  font-size: 8px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase;
  color: rgba(232,234,240,0.45); display: flex; align-items: center; gap: 12px; margin: 22px 0 12px;
}
.section-label::before { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, rgba(232,234,240,0.18)); }
.section-label::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(to left,  transparent, rgba(232,234,240,0.18)); }
.empty { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }

/* ══════════════════════════════
   RANK BADGE SVG — image based
   ══════════════════════════════ */
.badge-wrap { display: inline-flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
.badge-wrap svg { display: block; }

/* ── HOME — Streaks compact row ── */
.streak-row { display: flex; align-items: center; padding: 9px 14px; background: rgba(232,234,240,0.025); border: 1px solid rgba(232,234,240,0.07); border-radius: 3px; margin-bottom: 10px; }
.streak-item { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
.streak-item+.streak-item { border-left: 1px solid rgba(232,234,240,0.06); }
.streak-svg { flex-shrink: 0; color: var(--gold); opacity: 0.5; }
.streak-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; line-height: 1; color: var(--gold); letter-spacing: 0.03em; }
.streak-num.loading { opacity: 0.2; }

/* ── Loading Screen ── */
#loadOverlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1); }
#loadOverlay.done { opacity: 0; pointer-events: none; }
.load-orrery { position: relative; width: 130px; height: 130px; }
.load-orrery::before { content: ''; position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; background: radial-gradient(circle, rgba(232,234,240,0.05) 0%, transparent 65%); pointer-events: none; }
.load-r1 { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(232,234,240,0.10); animation: rrot 50s linear infinite; }
.load-r2 { position: absolute; inset: 20px; border-radius: 50%; border: 1px solid rgba(232,234,240,0.07); animation: rrot 34s linear infinite reverse; }
.load-r3 { position: absolute; inset: 40px; border-radius: 50%; border: 1px solid rgba(232,234,240,0.13); }
.load-core { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px 5px rgba(232,234,240,0.3), 0 0 40px rgba(232,234,240,0.12); animation: core-pulse 3.5s ease-in-out infinite; }
@keyframes core-pulse { 0%,100% { box-shadow: 0 0 14px 5px rgba(232,234,240,0.3), 0 0 40px rgba(232,234,240,0.12); } 50% { box-shadow: 0 0 22px 9px rgba(232,234,240,0.45), 0 0 70px rgba(232,234,240,0.18); } }
.load-d1 { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px 3px rgba(232,234,240,0.55), 0 0 22px rgba(232,234,240,0.2); top: 50%; left: 50%; margin: -3.5px 0 0 -3.5px; animation: ld1 2.4s linear infinite; }
.load-d2 { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(232,234,240,0.55); box-shadow: 0 0 7px 2px rgba(232,234,240,0.3); top: 50%; left: 50%; margin: -2px 0 0 -2px; animation: ld2 1.55s linear infinite reverse; }
.load-d3 { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(232,234,240,0.35); top: 50%; left: 50%; margin: -1.5px 0 0 -1.5px; animation: ld3 3.8s linear infinite; }
@keyframes ld1 { 0% { transform: rotate(0deg) translateX(65px); } 100% { transform: rotate(360deg) translateX(65px); } }
@keyframes ld2 { 0% { transform: rotate(0deg) translateX(45px); } 100% { transform: rotate(360deg) translateX(45px); } }
@keyframes ld3 { 0% { transform: rotate(60deg) translateX(25px); } 100% { transform: rotate(420deg) translateX(25px); } }
@keyframes rrot { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.load-text { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.load-pct { font-family: 'Bebas Neue', sans-serif; font-size: 58px; letter-spacing: 0.1em; color: var(--gold); text-shadow: 0 0 50px rgba(232,234,240,0.22), 0 0 100px rgba(232,234,240,0.08); line-height: 1; text-align: center; }
.load-sublabel { font-size: 7px; font-weight: 700; letter-spacing: 0.40em; color: rgba(232,234,240,0.25); text-transform: uppercase; }
.load-bar-track { width: 190px; height: 1px; background: rgba(232,234,240,0.07); border-radius: 99px; overflow: hidden; }
.load-bar-fill { height: 100%; background: linear-gradient(to right, rgba(232,234,240,0.15), rgba(232,234,240,0.7), var(--gold)); border-radius: 99px; width: 0%; transition: width 0.55s cubic-bezier(0.25,1,0.5,1); box-shadow: 0 0 8px rgba(232,234,240,0.4); }

/* ── Body mini cards ── */
.muscle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.muscle-mini {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; cursor: pointer;
  transition: border-color 0.2s; position: relative; overflow: hidden;
  min-height: 100px;
}
.muscle-mini:hover { border-color: var(--border-glow); }
.muscle-mini-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; gap: 4px; }
.muscle-mini-name { font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
.muscle-pct-big  { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.02em; margin-bottom: 1px; line-height: 1; }
.muscle-of       { font-size: 9px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; letter-spacing: 0.04em; }
.prog-track      { height: 2px; background: var(--bg-hi); border-radius: 1px; overflow: hidden; margin-bottom: 5px; }
.prog-fill       { height: 100%; border-radius: 1px; transition: width 0.9s ease; animation: prog-in 0.9s cubic-bezier(0.4,0,0.2,1) both; }
@keyframes prog-in { from { width: 0 !important; } }

/* Days inactive badge */
.muscle-bottom-row { display: flex; align-items: center; justify-content: space-between; }
.days-inactive { font-size: 9px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text-faint); letter-spacing: 0.04em; }
.days-inactive.active { color: var(--green-text); }
.days-inactive.recent { color: var(--text-dim); }
.days-inactive.stale  { color: var(--text-faint); }
.muscle-vs       { font-size: 9px; font-weight: 600; font-family: 'JetBrains Mono', monospace; text-align: right; }

/* ── TASKS ── */
.action-row { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 10px; }
.sleep-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.sleep-btn { background: var(--bg-card); border: 1px solid var(--border-hi); border-radius: 6px; color: var(--text-dim); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 4px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
.sleep-btn:active { transform: scale(0.97); }
.sleep-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.sleep-btn-icon { font-size: 16px; line-height: 1; }
.sleep-btn.great { border-color: rgba(74,160,100,0.4); color: #7ec99a; }
.sleep-btn.great:hover { background: rgba(74,160,100,0.08); }
.sleep-btn.ok { border-color: rgba(192,144,48,0.4); color: #c09030; }
.sleep-btn.ok:hover { background: rgba(192,144,48,0.08); }
.sleep-btn.bad { border-color: rgba(140,46,32,0.4); color: var(--red-hi); }
.sleep-btn.bad:hover { background: rgba(140,46,32,0.08); }
.action-btn {
  background: var(--bg-card); border: 1px solid var(--border-hi);
  border-radius: 6px; color: var(--text-dim);
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 12px 8px; cursor: pointer; transition: all 0.2s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: 'Inter', sans-serif;
}
.action-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
.action-btn:active { transform: scale(0.97); }
.action-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.action-btn-icon { font-size: 14px; }
.action-btn.gold-btn { border-color: var(--gold-dim); color: var(--gold); }
.action-btn.gold-btn:hover { background: var(--gold-glow); }

.tmpl-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 6px; }
.tmpl-title { font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 7px; display: flex; align-items: center; gap: 5px; }
.tmpl-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
.tmpl-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.tmpl-pill {
  background: var(--bg-mid); border: 1px solid var(--border-hi);
  border-radius: 3px; padding: 5px 9px; font-size: 11px; font-weight: 500;
  color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.tmpl-pill:hover { border-color: var(--gold-dim); color: var(--gold); }
.tmpl-pill:active { transform: scale(0.97); }

.date-hdr {
  font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--gold-dim); display: flex; align-items: center; gap: 8px; margin: 14px 0 7px;
}
.date-hdr::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--gold-dim), transparent); opacity: 0.4; }

.cat-sub { font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); margin: 7px 0 4px 2px; display: flex; align-items: center; gap: 5px; }
.cat-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }

.task-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 5px; margin-bottom: 4px; transition: border-color 0.15s; user-select: none; position: relative;
}
.task-item:active { transform: scale(0.99); }
.task-item.done { opacity: 0.22; }
.task-item.done .task-name { text-decoration: line-through; }
.penalty-item { background: rgba(120,40,40,0.07); border: 1px solid rgba(120,40,40,0.28); border-radius: 3px; padding: 11px 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; position: relative; animation: penalty-pulse 3s ease-in-out infinite; }
.penalty-item.stage-2 { background: rgba(120,40,40,0.12); border-color: rgba(140,50,50,0.45); }
.penalty-item.stage-3 { background: rgba(120,40,40,0.18); border-color: rgba(160,60,60,0.65); animation: penalty-pulse-peak 2.5s ease-in-out infinite; }
.penalty-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #6e3030; border-radius: 0; }
.penalty-item.stage-2::before { background: #7a3535; }
.penalty-item.stage-3::before { background: #8a3a3a; }
@keyframes penalty-pulse { 0%,100%{border-color:rgba(120,40,40,0.28)} 50%{border-color:rgba(140,50,50,0.45)} }
@keyframes penalty-pulse-peak { 0%,100%{border-color:rgba(140,50,50,0.5)} 50%{border-color:rgba(160,60,60,0.75)} }
.penalty-cb { width: 20px; height: 20px; border-radius: 2px; border: 1px solid rgba(120,40,40,0.4); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #7a3535; transition: all 0.2s; }
.penalty-cb:active { background: rgba(120,40,40,0.15); }
.penalty-name { font-size: 13px; color: var(--text); flex: 1; }
.penalty-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.penalty-tag { font-size: 7px; font-weight: 800; letter-spacing: 0.18em; color: #7a3838; border: 1px solid rgba(120,40,40,0.35); border-radius: 2px; padding: 2px 5px; }
.penalty-tag.peak { color: #a04848; border-color: rgba(140,50,50,0.5); }
.penalty-timer { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #504040; letter-spacing: 0.06em; }
.penalty-section-label { font-size: 8px; font-weight: 700; letter-spacing: 0.2em; color: #7a3838; text-transform: uppercase; margin: 4px 0 8px; }
.ztd-banner { border: 1px solid rgba(120,40,40,0.5); border-left: 3px solid #8a3a3a; background: rgba(120,40,40,0.08); border-radius: 3px; padding: 10px 13px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.ztd-banner-label { font-size: 8px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; color: #8a3a3a; }
.ztd-banner-sub { font-size: 8px; letter-spacing: 0.1em; color: #504040; }
.task-item.is-lockdown { border-color: rgba(120,40,40,0.22); }
.task-item.is-lockdown::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: rgba(120,40,40,0.4); border-radius: 0; }
.lockdown-pill { font-size: 7px; font-weight: 800; letter-spacing: 0.16em; color: rgba(120,40,40,0.65); border: 1px solid rgba(120,40,40,0.25); border-radius: 2px; padding: 2px 5px; }
.task-item.is-quest { border-color: rgba(232,234,240,0.55); background: linear-gradient(105deg, rgba(232,234,240,0.13) 0%, rgba(232,234,240,0.06) 45%, var(--bg-card) 75%); box-shadow: 0 0 24px rgba(232,234,240,0.10), 0 2px 10px rgba(0,0,0,0.35); overflow: hidden; animation: quest-pulse 4s ease-in-out infinite; }
.task-item.is-quest::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(to bottom, #ecddb8, var(--gold), rgba(232,234,240,0.35)); border-radius: 0 1px 1px 0; box-shadow: 0 0 8px rgba(232,234,240,0.5); }
.task-item.is-quest::after { content: ''; position: absolute; top: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, transparent, rgba(232,234,240,0.10), transparent); animation: quest-shine 5s ease-in-out infinite; left: -50%; pointer-events: none; }
.task-item.is-quest .task-name { color: var(--gold-hi); }
.task-item.is-quest .task-cb { border-color: rgba(232,234,240,0.45); }
@keyframes quest-pulse { 0%,100% { border-color: rgba(232,234,240,0.45); box-shadow: 0 0 18px rgba(232,234,240,0.08); } 50% { border-color: rgba(232,234,240,0.7); box-shadow: 0 0 28px rgba(232,234,240,0.16), 0 0 8px rgba(232,234,240,0.06) inset; } }
@keyframes quest-shine { 0%,25% { left:-50%; opacity:0; } 35% { opacity:1; } 65%,100% { left:160%; opacity:0; } }

.task-cb { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border-hi); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 9px; cursor: pointer; transition: all 0.15s; }
.task-item.done .task-cb { background: rgba(42,106,62,0.2); border-color: var(--green-text); color: var(--green-text); }
.task-item.is-quest .task-cb { border-color: var(--gold-dim); }

.task-body { flex: 1; min-width: 0; }
.task-miss { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-hi); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; color: var(--text-dim); cursor: pointer; transition: all 0.2s; opacity: 0.5; }
.task-miss:active { border-color: var(--red-hi); color: var(--red-hi); background: rgba(160,48,48,0.15); opacity: 1; }

/* Study timer widget (home screen) */
.study-widget { background: linear-gradient(145deg, rgba(232,234,240,0.05) 0%, var(--bg-card) 50%); border: 1px solid rgba(232,234,240,0.16); border-radius: 3px; padding: 16px 16px; margin-bottom: 16px; }
.study-widget.active { animation: session-pulse 4s ease-in-out infinite; }
@keyframes session-pulse {
  0%,100% { border-color: rgba(232,234,240,0.16); box-shadow: none; }
  50%      { border-color: rgba(232,234,240,0.45); box-shadow: 0 0 18px rgba(232,234,240,0.08); }
}
.study-widget-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.study-widget-label { font-size: 8px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
.today-count { color: var(--gold-dim); font-weight: 600; }
.sound-toggle { background: transparent; border: none; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-dim); cursor: pointer; padding: 2px; opacity: 0.6; transition: opacity 0.2s; line-height: 1; font-family: 'Inter', sans-serif; }
.sound-toggle.muted { color: var(--text-faint); text-decoration: line-through; }
.sound-toggle:active { opacity: 1; }
.pomo-toggle { display: flex; gap: 3px; }
.pomo-toggle-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 3px; cursor: pointer; transition: all 0.15s; }
.pomo-toggle-btn.active { border-color: var(--gold-dim); color: var(--gold); background: var(--gold-glow); }

/* ── Day Plan card ── */
/* ── Today's Focus card ── */
.focus-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px; padding: 14px 16px 12px; margin-bottom: 12px; }
.focus-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.focus-label { font-size: 8px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
.focus-goal-btn { font-size: 10px; font-weight: 600; color: var(--gold); background: none; border: none; cursor: pointer; padding: 0; letter-spacing: 0.04em; display: flex; align-items: center; gap: 4px; }
.focus-goal-btn.complete { color: #7ec99a; }
.focus-bar-track { height: 3px; background: rgba(232,234,240,0.08); border-radius: 99px; margin-bottom: 11px; overflow: hidden; }
.focus-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(to right, rgba(232,234,240,0.5), var(--gold)); transition: width 0.6s cubic-bezier(0.25,1,0.5,1); }
.focus-bar-fill.complete { background: linear-gradient(to right, #4a9a6a, #7ec99a); }
.focus-bottom { display: flex; align-items: center; justify-content: space-between; }
.focus-subjects { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.focus-chip { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 99px; background: rgba(232,234,240,0.07); border: 1px solid rgba(232,234,240,0.12); color: var(--text-dim); }
.focus-time { font-size: 10px; color: var(--text-dim); font-weight: 500; white-space: nowrap; margin-left: 8px; }
.plan-card { background: linear-gradient(145deg, rgba(232,234,240,0.04) 0%, var(--bg-card) 60%); border: 1px solid rgba(232,234,240,0.14); border-radius: 3px; padding: 16px; margin-bottom: 16px; }
.plan-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.plan-card-label { font-size: 8px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
.plan-gen-btn { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: var(--gold-glow); border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 4px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
.plan-gen-btn:active { opacity: 0.7; }
.plan-gen-btn:disabled { opacity: 0.4; cursor: default; }
.plan-generating { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 11px; padding: 8px 0; }
.plan-gen-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: blink 1s ease infinite; }
.plan-gen-dot:nth-child(2) { animation-delay: 0.2s; }
.plan-gen-dot:nth-child(3) { animation-delay: 0.4s; }
/* Daily recap */
.recap-card { background: var(--bg-card); border: 1px solid var(--border-hi); border-radius: 3px; padding: 14px 16px; margin-bottom: 12px; }
.recap-text { font-size: 12px; color: var(--text); line-height: 1.65; letter-spacing: 0.01em; }
.recap-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.recap-stat { display: flex; flex-direction: column; gap: 2px; }
.recap-stat-num { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--gold); }
.recap-stat-label { font-size: 7px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
.recap-stat-divider { width: 1px; background: var(--border); align-self: stretch; }
/* Study log bars */
.study-bars-wrap { padding: 6px 0 20px; }
.study-bars-label { font-size: 7px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
.study-bars { display: flex; gap: 3px; align-items: flex-end; height: 48px; }
.study-bar-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
.study-bar { width: 100%; border-radius: 2px 2px 0 0; transition: height 0.4s ease; min-height: 2px; }
.study-bar-day { font-size: 6.5px; color: var(--text-faint); letter-spacing: 0.04em; white-space: nowrap; }
.plan-energy { font-size: 7px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
.plan-energy.deep     { background: rgba(232,234,240,0.12); color: var(--gold); }
.plan-energy.medium   { background: rgba(232,234,240,0.06); color: var(--gold-dim); }
.plan-energy.light    { background: rgba(255,255,255,0.04); color: var(--text-dim); }
.plan-energy.movement { background: rgba(80,160,100,0.12);  color: #7ec99a; }
.plan-energy.none     { display: none; }
.plan-generating { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 11px; padding: 8px 0; }
.plan-gen-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: blink 1s ease infinite; }
.plan-gen-dot:nth-child(2) { animation-delay: 0.2s; }
.plan-gen-dot:nth-child(3) { animation-delay: 0.4s; }
.pomo-hint { font-size: 9px; color: var(--text-faint); letter-spacing: 0.08em; margin-top: 8px; text-align: center; }
.pomo-dots { display: flex; gap: 5px; margin-top: 4px; }
.pomo-dot { font-size: 10px; color: var(--text-faint); transition: color 0.3s; }
.pomo-dot.filled { color: var(--gold); }
.study-timer.pomo-work { color: var(--gold); }
.study-timer.pomo-break { color: var(--green-text); }
.study-idle { display: flex; gap: 8px; align-items: center; }
.subject-picker { flex: 1; background: var(--bg-mid); border: 1px solid var(--border-hi); border-radius: 5px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; padding: 8px 10px; appearance: none; -webkit-appearance: none; min-width: 0; }
.study-start-btn { flex-shrink: 0; background: rgba(232,234,240,0.08); border: 1px solid rgba(232,234,240,0.28); color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 0.10em; padding: 9px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all 0.2s; box-shadow: 0 0 16px rgba(232,234,240,0.06); }
.study-start-btn:hover { background: rgba(232,234,240,0.14); border-color: rgba(232,234,240,0.45); }
.study-start-btn:active { background: var(--gold-glow); transform: scale(0.97); }
.study-active { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.study-active-info { flex: 1; min-width: 0; }
.study-active-subject { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.study-timer { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 600; color: var(--gold); letter-spacing: 0.04em; line-height: 1; }
.study-stop-btn { flex-shrink: 0; background: transparent; border: 1px solid var(--border-hi); color: var(--text-dim); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; padding: 8px 14px; border-radius: 5px; cursor: pointer; transition: all 0.2s; }
.study-stop-btn:active { border-color: var(--red-hi); color: var(--red-hi); background: rgba(160,48,48,0.1); }

/* Pomo fullscreen countdown */
.pomo-screen { display: flex; flex-direction: column; align-items: center; padding: 24px 0 10px; }
.pomo-free-active { display: flex; flex-direction: column; align-items: flex-start; padding: 48px 0 32px; min-height: 58vh; justify-content: center; }
.free-timer-subject { font-family: 'Inter', sans-serif; font-size: 7px; font-weight: 400; letter-spacing: 0.36em; text-transform: uppercase; color: #2e2e2e; margin-bottom: 16px; }
.free-timer-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 0; margin-bottom: 0; }
.free-timer-digits { font-family: 'Bebas Neue', sans-serif; font-size: clamp(100px, 20vw, 220px); font-weight: 400; color: #d4d4d6; letter-spacing: 0.02em; line-height: 0.88; }
.free-timer-sep { display: inline-block; width: 2px; height: 0.55em; background: #d4d4d6; vertical-align: middle; margin: 0 6px; animation: sep-blink 1s step-start infinite; }
@keyframes sep-blink { 0%,49%{opacity:0.5} 50%,100%{opacity:0.1} }
.free-timer-bar { width: 100%; max-width: 560px; height: 1px; background: #151515; position: relative; margin-top: 28px; }
.free-timer-bar-fill { position: absolute; left: 0; top: 0; height: 1px; background: #505050; width: 0%; transition: width 1s linear; }
.free-timer-stop { margin-top: 28px; background: transparent; border: none; color: #1e1e1e; font-family: 'Inter', sans-serif; font-size: 7px; font-weight: 500; letter-spacing: 0.36em; text-transform: uppercase; padding: 0; cursor: pointer; transition: color 0.2s; }
.free-timer-stop:hover { color: #b91c1c; }
.pomo-screen-phase { font-size: 8px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; animation: phase-fade-in 0.4s ease; }
.pomo-screen-subject { font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.06em; margin-bottom: 24px; animation: phase-fade-in 0.5s ease; }
.pomo-ring-wrap { position: relative; width: 230px; height: 230px; margin: 0 auto; overflow: visible; }
.pomo-ring { width: 100%; height: 100%; overflow: visible; }
.pomo-ring-bg { fill: none; stroke: var(--border); stroke-width: 1.5; }
.pomo-ring-track { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 628.318; stroke-dashoffset: 0; transition: stroke-dashoffset 0.95s linear; }
.pomo-ring-time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.pomo-ring-countdown { font-family: 'JetBrains Mono', monospace; font-size: 50px; font-weight: 600; color: var(--text); letter-spacing: -0.03em; line-height: 1; animation: phase-fade-in 0.4s ease; text-shadow: 0 0 28px rgba(232,234,240,0.22); }
.pomo-ring-label { font-size: 8px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-faint); margin-top: 6px; }
.pomo-screen-dots { display: flex; gap: 12px; margin: 22px 0 8px; }
.pomo-screen-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-hi); transition: background 0.4s ease, box-shadow 0.4s ease; }
.pomo-screen-dot.filled { background: var(--gold); box-shadow: 0 0 6px var(--gold-dim); }
.pomo-screen-today { font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px; }
.pomo-screen-stop { background: transparent; border: 1px solid var(--border-hi); color: var(--text-dim); font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; padding: 9px 24px; border-radius: 4px; cursor: pointer; transition: all 0.2s; margin-bottom: 28px; }
.pomo-screen-stop:active { border-color: var(--red-hi); color: var(--red-hi); }
.pomo-log-divider { width: 100%; height: 1px; background: var(--border); margin-bottom: 16px; }
@keyframes phase-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* Study log tab */
.study-day-group { margin-bottom: 18px; }
.study-day-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.study-day-label { font-size: 8px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
.study-day-total { font-size: 9px; font-weight: 600; color: var(--gold-dim); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
.session-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 10px 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
.session-dur { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: var(--text); min-width: 46px; text-align: right; flex-shrink: 0; }
.session-body { flex: 1; min-width: 0; }
.session-subject { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-time { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.session-active { border-color: var(--gold-dim); }
.session-active .session-dur { color: var(--gold); animation: pulse-text 2s ease infinite; }
@keyframes pulse-text { 0%,100%{opacity:1} 50%{opacity:0.5} }
.session-quality { font-size: 7px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }
.session-quality.flow { background: rgba(232,234,240,0.12); color: var(--gold); }
.session-quality.grind { background: rgba(200,130,60,0.12); color: #c8824a; }
.session-quality.distracted { background: rgba(180,60,60,0.1); color: #c06060; }
/* Quality picker overlay */
.quality-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; display: flex; align-items: flex-end; justify-content: center; animation: fade-in 0.15s ease; }
.quality-sheet { background: var(--bg-card); border: 1px solid var(--border-hi); border-radius: 4px 4px 0 0; padding: 20px 20px 36px; width: 100%; max-width: 420px; }
.quality-title { font-size: 8px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 16px; text-align: center; }
.quality-btns { display: flex; gap: 10px; }
.quality-btn { flex: 1; padding: 14px 0; border-radius: 8px; border: 1px solid var(--border-hi); background: transparent; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.15s; }
.quality-btn.flow { color: var(--gold); }
.quality-btn.flow:active, .quality-btn.flow.picked { background: rgba(232,234,240,0.1); border-color: var(--gold-dim); }
.quality-btn.grind { color: #c8824a; }
.quality-btn.grind:active, .quality-btn.grind.picked { background: rgba(200,130,60,0.1); border-color: #6a4020; }
.quality-btn.distracted { color: #c06060; }
.quality-btn.distracted:active, .quality-btn.distracted.picked { background: rgba(180,60,60,0.08); border-color: #6a2020; }
.quality-skip { display: block; text-align: center; margin-top: 14px; font-size: 9px; color: var(--text-faint); letter-spacing: 0.1em; cursor: pointer; padding: 4px; }

/* ── Rival ── */
/* teaser on home */
.rival-teaser { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s; }
.rival-teaser:active { background: rgba(139,139,155,0.06); }
.rival-teaser-left { display: flex; align-items: center; gap: 8px; }
.rival-teaser-name { font-family: 'Ma Shan Zheng', serif; font-size: 26px; color: #8B8B9B; line-height: 1; }
.rival-teaser-status { font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.rival-teaser-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.rival-teaser-hours { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; color: #8B8B9B; line-height: 1; }
.rival-teaser-gap { font-size: 8px; letter-spacing: 0.06em; }
/* full rival page */
.rival-page { position: fixed; inset: 0; background: var(--bg); z-index: 400; overflow-y: auto; animation: fade-in 0.2s ease; }
.rival-page-inner { padding: 0 0 40px; max-width: 420px; margin: 0 auto; }
.rival-page-header { padding: 16px 16px 0; }
.rival-back { background: transparent; border: none; color: var(--text-dim); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; padding: 6px 0; }
.rival-break-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; padding: 5px 10px; border-radius: 6px; transition: all 0.15s; }
.rival-break-btn:active { background: rgba(232,234,240,0.06); border-color: rgba(232,234,240,0.2); color: var(--gold-dim); }
.rival-page-name { font-family: 'Ma Shan Zheng', serif; font-size: 88px; color: #8B8B9B; text-align: center; line-height: 1; margin: 16px 0 2px; }
.rival-page-subtitle { font-size: 8px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(139,139,155,0.4); text-align: center; margin-bottom: 24px; }
.rival-section-label { font-size: 7px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(139,139,155,0.35); margin-bottom: 8px; }
.rival-status-card { background: rgba(139,139,155,0.04); border: 1px solid rgba(139,139,155,0.1); border-radius: 3px; padding: 14px 16px; margin: 0 16px 10px; }
.rival-status-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.rival-status-dot { font-size: 10px; }
.rival-status-text { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; flex: 1; }
.rival-hours-today { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #8B8B9B; line-height: 1; }
.rival-gap { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; }
.rival-timeline { position: relative; height: 6px; background: rgba(139,139,155,0.08); border-radius: 3px; overflow: visible; margin-top: 4px; }
.rival-session-block { position: absolute; top: 0; height: 100%; border-radius: 2px; transition: background 0.3s; }
.rival-now-marker { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: rgba(255,255,255,0.5); border-radius: 1px; }
.rival-week-card { background: rgba(139,139,155,0.04); border: 1px solid rgba(139,139,155,0.1); border-radius: 3px; padding: 14px 16px; margin: 0 16px 10px; }
.rival-week-compare { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.rival-week-stat { flex: 1; }
.rival-week-name { font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(139,139,155,0.5); margin-bottom: 3px; }
.rival-week-hours { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.04em; color: #8B8B9B; line-height: 1; }
.rival-week-sep { font-size: 9px; color: var(--text-faint); letter-spacing: 0.1em; }
.rival-week-bars { display: flex; gap: 4px; align-items: stretch; }
.rival-week-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rival-week-bar { width: 100%; border-radius: 2px 2px 0 0; min-height: 2px; transition: height 0.3s; }
.rival-week-bar-day { font-size: 7px; color: rgba(139,139,155,0.35); font-weight: 700; }
.rival-streak-card { background: rgba(139,139,155,0.04); border: 1px solid rgba(139,139,155,0.1); border-radius: 3px; padding: 14px 16px; margin: 0 16px 10px; }
.rival-streak-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 10px; }
.rival-streak-num { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: #8B8B9B; line-height: 1; }
.rival-streak-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(139,139,155,0.4); }
.rival-streak-dots { display: flex; gap: 5px; }
.rival-streak-dot { width: 8px; height: 8px; border-radius: 50%; }
.rival-streak-dot.active { background: #8B8B9B; }
.rival-streak-dot.dark { background: rgba(139,139,155,0.15); }
.rival-workout-card { background: rgba(139,139,155,0.04); border: 1px solid rgba(139,139,155,0.1); border-radius: 3px; padding: 14px 16px; margin: 0 16px 10px; }
.rival-workout-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.rival-workout-row-label { font-size: 7px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; width: 24px; flex-shrink: 0; }
.rival-workout-cats { display: flex; gap: 4px; flex: 1; }
.rival-workout-cat { font-size: 7px; font-weight: 800; letter-spacing: 0.1em; padding: 2px 5px; border-radius: 3px; line-height: 1.4; }
.rival-workout-cat.push { color: #d8956a; background: rgba(216,149,106,0.12); }
.rival-workout-cat.pull { color: #6abcaa; background: rgba(106,188,170,0.12); }
.rival-workout-cat.legs { color: #9b7ac0; background: rgba(155,122,192,0.12); }
.rival-workout-cat.core { color: #c9a84c; background: rgba(201,168,76,0.12); }
.rival-workout-cat.arms { color: #c07090; background: rgba(192,112,144,0.12); }
.rival-workout-cat.rest { color: rgba(139,139,155,0.2); background: transparent; }
.rival-workout-streaks { display: flex; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(139,139,155,0.08); }
.rival-workout-streak-block { flex: 1; }
.rival-workout-streak-who { font-size: 7px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(139,139,155,0.4); margin-bottom: 2px; }
.rival-workout-streak-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; }
.rival-workout-streak-unit { font-size: 8px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(139,139,155,0.35); margin-left: 3px; }
.rival-wl-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(139,139,155,0.08); }
.rival-wl-dots { display: flex; gap: 5px; align-items: center; }
.rival-wl-dot { width: 9px; height: 9px; border-radius: 50%; }
.rival-wl-dot.win { background: var(--gold); }
.rival-wl-dot.loss { background: rgba(139,139,155,0.6); }
.rival-wl-dot.tie { background: rgba(255,255,255,0.18); }
.rival-wl-dot.future { background: transparent; border: 1px solid rgba(255,255,255,0.08); }
.rival-wl-record { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
.rival-xp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.rival-xp-row:last-child { margin-bottom: 0; }
.rival-xp-cat { font-size: 7px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); width: 32px; flex-shrink: 0; }
.rival-xp-gap { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; letter-spacing: 0.04em; }

/* Exam cards */
.exam-section-label { font-size: 8px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin: 18px 0 8px; padding-left: 2px; }
.exam-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; }
.exam-card.upcoming { border-color: var(--border-hi); }
.exam-card.past     { opacity: 0.65; }
.exam-countdown { min-width: 40px; text-align: center; flex-shrink: 0; }
.exam-countdown-num { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--gold); line-height: 1; }
.exam-countdown-label { font-size: 7px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-dim); margin-top: 2px; }
.exam-countdown.past-badge { min-width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.exam-grade { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; line-height: 1; }
.exam-grade.g1 { color: #c04040; } .exam-grade.g2 { color: #c07030; } .exam-grade.g3 { color: #c0a020; }
.exam-grade.g4 { color: #4a8a60; } .exam-grade.g5 { color: #3060a0; }
.exam-pct { font-size: 8px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 2px; }
.exam-body { flex: 1; min-width: 0; }
.exam-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exam-date { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
.exam-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.exam-tag { font-size: 7px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; border: 1px solid; }
.exam-tag.type-tag { color: #5060a0; border-color: #1c2040; background: #080c1c; }
.exam-tag.subj-tag { color: var(--text-dim); border-color: var(--border); background: transparent; }

.task-name { font-size: 13px; font-weight: 400; line-height: 1.3; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.task-tags { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

.diff-pill { font-size: 8px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; border: 1px solid; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.diff-pill:active { transform: scale(0.95); }
.diff-Maintenance { color: var(--text-faint); border-color: var(--border); background: transparent; }
.diff-Normal      { color: #286040; border-color: #1a3a28; background: #0a1810; }
.diff-Heavy       { color: #6a2020; border-color: #3a1010; background: #140808; }
.diff-Daily       { color: var(--gold-dim); border-color: var(--gold-dim); background: var(--gold-glow); }
.diff-Important   { color: #4a2870; border-color: #2a1848; background: #100818; }

.quest-tag { font-size: 7.5px; font-weight: 800; letter-spacing: 0.18em; color: #0d0c09; background: linear-gradient(135deg, #ecddb8 0%, #e0d0a8 50%, #c8b070 100%); border: none; border-radius: 2px; padding: 2px 7px; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.4), 0 0 8px rgba(232,234,240,0.25); }
.task-due { font-size: 9px; font-weight: 500; color: var(--text-faint); }
.task-due.overdue { color: var(--red-hi); }
.task-study-tag { font-size: 8px; font-weight: 600; letter-spacing: 0.06em; color: #4a80d8; opacity: 0.7; padding: 2px 5px; border: 1px solid rgba(74,128,216,0.25); border-radius: 2px; flex-shrink: 0; }

/* ── STATS ── */
.sil-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 20px; margin-bottom: 12px; position: relative; overflow: hidden; }

/* Next exam countdown */
.next-exam-card { background: var(--bg-card); border: 1px solid var(--border-hi); border-radius: 3px; padding: 13px 16px; margin-bottom: 12px; position: relative; overflow: hidden; }
.next-exam-card::before { display: none; }
.next-exam-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.next-exam-label { font-size: 7px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
.next-exam-name { font-size: 13px; font-weight: 500; color: var(--text); }
.next-exam-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.countdown-wrap { display: flex; gap: 6px; align-items: flex-end; }
.cd-block { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.cd-num { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.cd-lbl { font-size: 7px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }
.countdown-col { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; margin-left: 12px; }
.countdown-unit { display: flex; flex-direction: column; align-items: center; }
.countdown-num { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: var(--gold); line-height: 1; min-width: 26px; text-align: center; }
.countdown-lbl { font-size: 6px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-top: 2px; }
.countdown-sep { font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--text-faint); line-height: 1; padding-bottom: 2px; }
.awake-row { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; }
.awake-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #d06848; letter-spacing: 0.04em; line-height: 1; }
.awake-unit { font-size: 8px; font-weight: 600; color: #9a4832; }
.awake-sep { color: var(--text-faint); font-size: 10px; }
.awake-nights { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: #9a4832; }
.sil-wrap::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 20%, rgba(184,148,42,0.03) 0%, transparent 60%); pointer-events: none; }
.sil-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sil-title { font-size: 8px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
.sil-toggle { display: flex; gap: 4px; }
.sil-toggle-btn { font-size: 8px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; border: 1px solid var(--border-hi); background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.2s; }
.sil-toggle-btn.active { border-color: var(--gold-dim); color: var(--gold); background: var(--gold-glow); }
.sil-legend { display: flex; gap: 12px; margin-top: 8px; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-dim); }
.legend-dot { width: 5px; height: 5px; border-radius: 50%; }

.muscle-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.muscle-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.muscle-card:hover { border-color: var(--border-glow); }
.muscle-card.selected { border-width: 1px; }
.muscle-card-top-bar { position: absolute; top: 0; left: 0; right: 0; height: 1px; }
.muscle-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.muscle-card-name { font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }

.detail-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 10px; }
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
.detail-name { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 0.05em; line-height: 1; }
.detail-stats { display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr; background: var(--border); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.detail-stat-div { background: var(--border); }
.detail-stat { background: var(--bg-card); padding: 10px 8px; text-align: center; }
.detail-stat-label { font-size: 7px; font-weight: 700; letter-spacing: 0.18em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 5px; }
.detail-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }

/* ── Toast ── */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg-hi); border: 1px solid var(--border-hi); color: var(--text); padding: 9px 18px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; z-index: 200; white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.6); animation: toast-up 0.2s ease; pointer-events: none; }
@keyframes toast-up { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ── Pomo Flash Overlay ── */
.pomo-flash-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.93); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 310; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
.pomo-flash-overlay.visible { opacity: 1; pointer-events: all; }
.pf-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pf-dot { position: absolute; border-radius: 50%; animation: pf-fly 1.8s ease forwards; }
@keyframes pf-fly { 0% { transform: translateY(60vh) scale(1) rotate(0deg); opacity: 1; } 80% { opacity: 0.7; } 100% { transform: translateY(-25vh) scale(0.4) rotate(540deg); opacity: 0; } }
.pf-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.45em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; animation: phase-fade-in 0.4s ease; }
.pf-glyph { font-family: 'Bebas Neue', sans-serif; font-size: 88px; line-height: 1; letter-spacing: 0.04em; color: var(--gold); text-shadow: 0 0 48px rgba(232,234,240,0.55), 0 0 12px rgba(232,234,240,0.3); animation: pop-in 0.55s cubic-bezier(0.175,0.885,0.32,1.275); }
.pf-sub { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); margin-top: 12px; animation: phase-fade-in 0.5s ease 0.1s both; }
.pf-dots-row { display: flex; gap: 8px; margin-top: 22px; animation: phase-fade-in 0.5s ease 0.2s both; }
.pf-session-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(232,234,240,0.18); border: 1px solid rgba(232,234,240,0.22); transition: background 0.2s; }
.pf-session-dot.done { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(232,234,240,0.45); }
.pf-bar-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(232,234,240,0.08); }
.pf-bar { height: 100%; background: linear-gradient(to right, var(--gold), rgba(232,234,240,0.5)); transform-origin: left; animation: pf-drain 3s linear forwards; }
@keyframes pf-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.pf-tap { font-size: 8px; color: var(--text-faint); letter-spacing: 0.14em; margin-top: 28px; animation: blink 1.6s ease infinite; }
@keyframes screen-flash { 0% { opacity: 0; } 6% { opacity: 0.55; } 18% { opacity: 0.35; } 100% { opacity: 0; } }
.screen-flash-el { position: fixed; inset: 0; background: rgba(224,208,168,1); pointer-events: none; z-index: 305; opacity: 0; animation: screen-flash 1s ease forwards; }

/* ── Rank-up overlay ── */
.rankup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.rankup-overlay.visible { opacity: 1; pointer-events: all; }
.rankup-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
.rankup-muscle { font-family: 'Bebas Neue', sans-serif; font-size: 48px; letter-spacing: 0.06em; color: var(--gold); animation: pop-in 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
.rankup-new { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 14px; color: var(--text-dim); }
.rankup-tap { font-size: 9px; color: var(--text-faint); letter-spacing: 0.14em; margin-top: 28px; animation: blink 1.5s ease infinite; }
@keyframes pop-in { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
.rankup-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.particle { position: absolute; border-radius: 50%; animation: fly-up 1.5s ease forwards; }
@keyframes fly-up { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }

/* ── Workout Modal ── */
.workout-modal{position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.workout-modal.visible{opacity:1;pointer-events:all;}
.workout-sheet{background:var(--card);border-radius:4px 4px 0 0;padding:18px 16px 36px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);}
.workout-modal.visible .workout-sheet{transform:translateY(0);}
.workout-sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.workout-sheet-title{font-size:13px;font-weight:800;letter-spacing:0.12em;color:var(--gold);margin-bottom:12px;}
.workout-day-label{font-size:9px;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:var(--text-dim);margin:10px 0 5px;}
.workout-ex-list{display:flex;flex-direction:column;gap:3px;margin-bottom:6px;}
.workout-ex-item{padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.workout-ex-item:hover,.workout-ex-item.selected{border-color:var(--gold);background:rgba(232,234,240,0.07);}
.workout-ex-name{font-size:12px;font-weight:600;color:var(--text);}
.workout-ex-meta{font-size:9px;color:var(--text-dim);margin-top:2px;}
.workout-inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 10px;}
.workout-input-group{display:flex;flex-direction:column;gap:4px;}
.workout-input-label{font-size:9px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-dim);}
.workout-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:14px;font-weight:700;color:var(--text);text-align:center;width:100%;box-sizing:border-box;font-family:inherit;}
.workout-input:focus{outline:none;border-color:var(--gold);}
.workout-muscle-preview{background:var(--bg);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:10px;color:var(--text-dim);}
.workout-muscle-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.workout-muscle-tag{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.04em;}
.wmt-primary{background:rgba(232,234,240,0.12);color:var(--gold);border:1px solid rgba(232,234,240,0.28);}
.wmt-secondary{background:rgba(100,100,100,0.12);color:var(--text-dim);border:1px solid var(--border);}
.workout-submit-btn{width:100%;padding:13px;background:var(--gold);color:#0a0a0e;font-size:12px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;border:none;border-radius:3px;cursor:pointer;font-family:inherit;}
.workout-submit-btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ── Workout Tab Cards ── */
.wec{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:10px 14px;margin-bottom:4px;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.wec:hover{border-color:rgba(232,234,240,0.3);}

.wec-row{display:flex;justify-content:space-between;align-items:center;}

.wec-meta{font-size:9px;color:var(--text-dim);margin-top:2px;}

/* ── Lecture review ── */
.lec-badge{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:8px;background:var(--gold);color:#000;font-size:8px;font-weight:700;vertical-align:middle;}

.lec-sub{font-size:9px;color:var(--text-dim);line-height:1.45;margin:0 0 9px;opacity:0.75;}
.lec-box{font-size:8px;font-weight:700;letter-spacing:0.1em;color:var(--text-dim);border:1px solid var(--line,#2a2a2a);border-radius:3px;padding:1px 5px;flex-shrink:0;}
.lec-btns{display:flex;gap:5px;}
.lec-btn{flex:1;padding:7px 0;border-radius:4px;border:1px solid var(--line,#2a2a2a);background:transparent;color:var(--text-dim);font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;}

.lec-shaky{border-color:#6b3030;color:#c97070;}
.lec-ok{border-color:#6b5a30;color:#c9a970;}
.lec-solid{border-color:#356b35;color:#79c979;}
.lec-course{margin-bottom:16px;}

.lec-course-name{font-size:11px;color:var(--text);}
.lec-course-meta{font-size:9px;color:var(--text-dim);flex-shrink:0;}
.lec-bar{height:3px;background:var(--bg-soft,#1a1a1a);border-radius:2px;overflow:hidden;margin-bottom:7px;}
.lec-bar-fill{height:100%;background:var(--gold);}
.lec-add-row{display:flex;gap:5px;margin-bottom:6px;}
.lec-add-inp{flex:1;min-width:0;background:var(--bg-soft,#111);border:1px solid var(--line,#2a2a2a);border-radius:4px;color:var(--text);font-size:11px;padding:6px 8px;font-family:inherit;}
.lec-add-btn{width:32px;flex-shrink:0;background:transparent;border:1px solid var(--line,#2a2a2a);border-radius:4px;color:var(--text-dim);font-size:14px;cursor:pointer;}
.lec-list{border-left:1px solid var(--line,#2a2a2a);padding-left:8px;}
.lec-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:10px;color:var(--text-dim);}

.lec-held-btn{border:1px solid var(--line,#2a2a2a);border-radius:3px;padding:1px 6px;font-size:8px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;color:var(--text-dim);}

.lec-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:9px 11px;border:1px solid var(--line,#2a2a2a);border-radius:5px;font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);}

.lec-chev{font-size:10px;opacity:0.7;}
.lec-sub{font-size:9px;color:var(--text-dim);line-height:1.45;margin:-4px 0 9px;opacity:0.85;}
/* ── Muscle ranks by body part ── */
.rk-overall{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--line,#2a2a2a);border-radius:6px;margin-bottom:16px;background:var(--bg-soft,#141414);}

.rk-overall-lbl{font-size:8px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);}
.rk-overall-rank{font-size:15px;font-weight:700;letter-spacing:0.04em;margin-top:3px;}
.rk-overall-sub{font-size:9px;color:var(--text-dim);margin-top:2px;}
.rk-group{margin-bottom:13px;}
.rk-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
.rk-badge-sm{flex-shrink:0;line-height:0;}
.rk-name{font-size:12px;color:var(--text);}
.rk-rank{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
.rk-count{color:var(--text-dim);font-weight:400;letter-spacing:0.04em;}
.rk-chev{font-size:10px;color:var(--text-dim);opacity:0.7;flex-shrink:0;}
.rk-bar{height:3px;background:var(--bg-soft,#1a1a1a);border-radius:2px;overflow:hidden;margin-top:6px;}
