}

function getPenaltyText(taskDef,stage){return taskDef['p'+stage]||taskDef.p1||'';}

function escalatePenalties(){
  const now=Date.now();
  let changed=false;
  (state.penalties||[]).forEach(p=>{
    if(p.done)return;
    const hoursOld=(now-new Date(p.issuedAt).getTime())/3600000;
    const newStage=hoursOld>=PENALTY_STAGE_HOURS[2]?3:hoursOld>=PENALTY_STAGE_HOURS[1]?2:1;
    if(newStage>p.stage){
      p.stage=newStage;
      const def=DAILY_TASKS.find(t=>t.name===p.task);
      if(def)p.text=getPenaltyText(def,newStage);
      changed=true;
    }
  });
  if(changed)savePenalties();
}

async function expirePenalties(){
  const now=Date.now();
  const expired=(state.penalties||[]).filter(p=>{
    const hoursOld=(now-new Date(p.issuedAt).getTime())/3600000;
    return hoursOld>=PENALTY_EXPIRY_HOURS&&!p.done;
  });
  if(!expired.length)return;
  for(const p of expired){
    showToast(`GATE BROKEN — ${p.task.toUpperCase()} — STAT DEGRADED`,5000);
    await finalizeDebtOnExpiry(p);
    p.scarred=true;
    p.scarredAt=new Date().toISOString();
  }
  state.penalties=(state.penalties||[]).filter(p=>{
    const hoursOld=(now-new Date(p.issuedAt).getTime())/3600000;
    return hoursOld<PENALTY_EXPIRY_HOURS;
  });
  savePenalties();
}

async function checkAndIssuePenalties(){
  try{
    const today=localToday();
    const yesterday=prevDay(today);
    // Only run once per day — skip if already checked today
    const checkedPages=await appConfigRows('penalty_check_date');
    const lastChecked=checkedPages.length?checkedPages[0].properties?.Value?.rich_text?.map(r=>r.plain_text).join(''):'';
    if(lastChecked===today)return;
    // Mark as checked for today
    if(checkedPages.length){await nPatch(checkedPages[0].id,{Value:{rich_text:[{text:{content:today}}]}});}
    else{await nCreate(DB.appConfig,{Key:{title:[{text:{content:'penalty_check_date'}}]},Value:{rich_text:[{text:{content:today}}]}});}
    const logs=await nQuery(DB.dailyLog,{property:'Date',date:{equals:yesterday}});
    if(!logs.length)return;
    const q=logs[0].properties;
    const getQNum=v=>{const n=g.num(v)??g.formula(v)??g.rollup(v);return n!=null?Number(n):null;};
    const yesterdayQuestIds=[getQNum(q['Quest 1']),getQNum(q['Quest 2']),getQNum(q['Quest 3'])].filter(n=>n!=null&&n>0);
    if(!yesterdayQuestIds.length)return;
    const doneTasks=await nQuery(DB.tasks,{and:[
      {property:'Status',checkbox:{equals:true}},
      {property:'Due Date',date:{equals:yesterday}},
    ]});
    const doneNames=new Set(doneTasks.map(p=>g.title(p.properties.Task)));
    const missedTasks=DAILY_TASKS.filter(t=>
      t.questId&&t.p1&&yesterdayQuestIds.includes(t.questId)&&!doneNames.has(t.name)
    );
    if(!missedTasks.length)return;
    const existingTasks=new Set((state.penalties||[]).map(p=>p.task));
    const newPenalties=missedTasks
      .filter(t=>!existingTasks.has(t.name))
      .map(t=>({task:t.name,text:t.p1,cat:t.cat,stage:1,issuedAt:new Date().toISOString(),done:false,...(state.ztd?{ztd:true}:{})}));
    if(!newPenalties.length)return;
    state.penalties=[...(state.penalties||[]),...newPenalties];
    await savePenalties();
    showToast(`${newPenalties.length} PENALTY QUEST${newPenalties.length>1?'S':''} ISSUED`,4000);
  }catch(e){warn('checkAndIssuePenalties',e);}
}

async function completePenalty(idx){
  if(!state.penalties||!state.penalties[idx])return;
  const p=state.penalties[idx];
  const def=DAILY_TASKS.find(t=>t.name===p.task);
  // Set lockdown — cleared stage haunts as daily for 7 days
  if(def){
    const until=new Date(Date.now()+PENALTY_LOCKDOWN_DAYS*86400000).toISOString();
    state.lockdowns=state.lockdowns||[];
    state.lockdowns=state.lockdowns.filter(l=>l.task!==p.task); // replace existing
    state.lockdowns.push({task:p.task,stage:p.stage,text:p.text,cat:p.cat,until});
  }
  p.done=true;
  await completeDebtForPenalty(p);
  state.penalties=state.penalties.filter(p=>!p.done);
  await savePenalties();
  const stageLabel=p.stage===3?'PEAK':p.stage===2?'STAGE II':'STAGE I';
  showToast(`PENALTY CLEARED [${stageLabel}] — ${PENALTY_LOCKDOWN_DAYS} DAY LOCKDOWN ACTIVE`,4000);
  renderTasks();
}

      ...(t.questId!=null?{'Quest ID':{number:t.questId}}:{}),
      ...(t.base!=null?{Base:{number:t.base}}:{}),
      ...(t.stat!=null?{Stat:{relation:[{id:t.stat}]}}:{}),
    })));

    // 3. Query any existing tasks due today and combine
    const existingTasks=await nQuery(DB.tasks,{and:[
      {property:'Status',      checkbox:{equals:false}},
      {property:'Missed check1',checkbox:{equals:false}},
      {property:'Due Date',    date:{equals:today}},
    ]});
    const uniqueIds=[...new Set([
      ...newTaskPages.map(p=>p.id),
      ...existingTasks.map(t=>t.id),
    ])];

    // 4. Link all tasks to the daily log
    await Promise.all(uniqueIds.map(id=>nPatch(id,{'Daily log':{relation:[{id:logId}]}})));

    delete _tabLoadedAt['tasks'];
    showToast(`Good morning · ${sleepName}`,3000);
    await loadTasks();renderTasks();
  }catch(e){
    showToast('Failed: '+e.message);
  }finally{
    // Re-render restores buttons naturally; just in case render didn't fire:
    btns.forEach(b=>{if(b)b.disabled=false;});
    renderTasks();
  }
}

async function addWorkout(){
  // Ensure exercises and body stats are loaded
  if(!state.exercises.length){
    try{const p=await nQuery(DB.exerciseLibrary);state.exercises=p.map(toExercise);}
    catch(e){showToast('Failed to load exercises: '+e.message);return;}
  }
  if(!state.bodyStats.length){
    try{const p=await nQuery(DB.bodyStats);state.bodyStats=p.map(toBodyStat);}
    catch(e){showToast('Failed to load body stats: '+e.message);return;}
  }
  selectedExercise=null;
  const DAY_ABBR=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayAbbr=DAY_ABBR[new Date().getDay()];
  const todayEx=state.exercises.filter(e=>e.day.includes(todayAbbr));
  const otherEx=state.exercises.filter(e=>!e.day.includes(todayAbbr));
  let html='';

    html+=`<div class="workout-day-label">Today · ${todayAbbr}</div><div class="workout-ex-list">${todayEx.map(exerciseItemHTML).join('')}</div>`;
  }

    html+=`<div class="workout-day-label">Other Days</div><div class="workout-ex-list">${otherEx.map(exerciseItemHTML).join('')}</div>`;
  }
  if(!state.exercises.length){html='<div style="color:var(--text-dim);font-size:11px;padding:8px">No exercises found</div>';}
  document.getElementById('workoutExerciseList').innerHTML=html;
  document.getElementById('workoutInputSection').style.display='none';
  const sb=document.getElementById('workoutSubmitBtn');
  sb.disabled=true;sb.textContent='SELECT AN EXERCISE';
  document.getElementById('workoutModal').classList.add('visible');
}

function exerciseItemHTML(e){

function selectExercise(id){
  selectedExercise=state.exercises.find(e=>e.id===id)??null;
  if(!selectedExercise)return;
  document.querySelectorAll('.workout-ex-item').forEach(el=>el.classList.remove('selected'));

}

// ── Shared exercise logging core ────────────────────────────────────────────
async function _logExercise(exercise, sets, reps, weight){
  const today=localToday();
  const muscleMap={};state.bodyStats.forEach(s=>{muscleMap[s.name]=s.id;});
  const primary=exercise.primaryMuscle;
  const secondary=exercise.musclesHit.filter(m=>m!==primary);
  const base={Sets:{number:sets},Reps:{number:reps},'Weight (kg)':{number:weight},
    Date:{date:{start:today}},Exercise:{relation:[{id:exercise.id}]}};
  const creates=[];
  // A muscle with no row in Body Stats can't be logged. Collect them rather than
  // dropping them quietly — a partial log used to look like a complete one.
  const skipped=[];
  if(primary){
    if(muscleMap[primary]){
      creates.push(nCreate(DB.workoutLog,{...base,
        Name:{title:[{text:{content:exercise.name}}]},
        'Muscle Stat':{relation:[{id:muscleMap[primary]}]},
        'XP Multiplier':{number:1.0}}));
    }else skipped.push(primary);
  }
  secondary.forEach(m=>{
    if(muscleMap[m]){
      creates.push(nCreate(DB.workoutLog,{...base,
        Name:{title:[{text:{content:exercise.name+' (2°)'}}]},
        'Muscle Stat':{relation:[{id:muscleMap[m]}]},
        'XP Multiplier':{number:0.5}}));
    }else skipped.push(m);
  });
  if(!creates.length)throw new Error('No Body Stats row for: '+(skipped.join(', ')||'this exercise'));
  invalidateWorkoutLog();  // new sets must show up straight away, not after the TTL
  if(skipped.length){
    warn('_logExercise.missingBodyStat',new Error(skipped.join(', ')));
    showToast('Not logged — no Body Stats row for '+skipped.join(', '),5000);
  }
  await Promise.all(creates);
  await loadBodyStats();
  return creates.length;
}

// ── Modal submit (existing bottom sheet) ────────────────────────────────────
async function submitWorkout(){
  if(!selectedExercise)return;
  const btn=document.getElementById('workoutSubmitBtn');
  btn.disabled=true;btn.textContent='LOGGING…';
  const sets=parseInt(document.getElementById('wSets').value)||3;
  const reps=parseInt(document.getElementById('wReps').value)||10;
  const weight=parseFloat(document.getElementById('wWeight').value)||0;
  try{
    const n=await _logExercise(selectedExercise,sets,reps,weight);
    closeWorkoutModal();
    showToast(`Logged ${selectedExercise.name} — ${n} muscle entr${n===1?'y':'ies'}`,3000);
    if(currentTab==='workout')renderWorkout();
  }catch(e){
    showToast('Failed: '+e.message);
    btn.disabled=false;btn.textContent=`LOG ${selectedExercise.name.toUpperCase()}`;
  }
}

// ── Workout Tab ──────────────────────────────────────────────────────────────
function toggleWorkoutExercise(id){
  expandedExercise=expandedExercise===id?null:id;
  renderWorkout();
  if(expandedExercise){
    setTimeout(()=>document.getElementById('wec-'+expandedExercise)
      ?.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  }
}

async function logExerciseFromTab(id){
  const exercise=state.exercises.find(e=>e.id===id);
  if(!exercise)return;
  const btn=document.getElementById('wec-btn-'+id);
  if(btn){btn.disabled=true;btn.textContent='LOGGING…';}
  const sets=parseInt(document.getElementById('wec-s-'+id)?.value)||3;
  const reps=parseInt(document.getElementById('wec-r-'+id)?.value)||10;
  const weight=parseFloat(document.getElementById('wec-w-'+id)?.value)||0;
  try{
    const n=await _logExercise(exercise,sets,reps,weight);
    expandedExercise=null;
    // Check PR
    const prMuscle=exercise.primaryMuscle;
    const prDef=PR_THRESHOLDS[prMuscle];
    if(prDef&&prMuscle){
      const value=prDef.isReps?reps:weight;
      const minOk=prDef.isReps?(reps>=prDef.thresholds[0]):(reps>=prDef.minReps);
      const prev=state.prs?.[prMuscle]??0;
      if(minOk&&value>prev){
        if(!state.prs)state.prs={};
        state.prs[prMuscle]=value;
        showToast(`PR — ${prMuscle.toUpperCase()} — ${prDef.isReps?value+' reps':value+'kg'}`,5000);
      }else{showToast(`Logged ${exercise.name} — ${n} muscle entr${n===1?'y':'ies'}`,3000);}
    }else{showToast(`Logged ${exercise.name} — ${n} muscle entr${n===1?'y':'ies'}`,3000);}
    renderWorkout();
  }catch(e){
    showToast('Failed: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='LOG '+exercise.name.toUpperCase();}
  }
}

function toggleWorkoutDay(abbr){
  if(!expandedWorkoutDays)expandedWorkoutDays=new Set();
  if(expandedWorkoutDays.has(abbr))expandedWorkoutDays.delete(abbr);
  else expandedWorkoutDays.add(abbr);
  renderWorkout();
}

function setWorkoutSubTab(v){
  workoutSubTab=v;
  const slider=document.getElementById('workout-slider');
  if(slider){
    const _panes=['workout','ranks','volume'];
    const _i=Math.max(0,_panes.indexOf(v));
    slider.style.transform='translateX(-'+(_i*(100/_panes.length))+'%)';
    // update pill indicators
    const btns=slider.parentElement.previousElementSibling.querySelectorAll('button');
    btns.forEach(b=>{
      const isActive=b.dataset.tab===v;
      b.classList.toggle('active',isActive);
    });
  } else {
    renderWorkout();
  }
}

function renderWorkout(){
  const el=document.getElementById('tab-workout');
  if(!state.exercises.length){
    el.innerHTML='<div class="empty" style="padding:32px 0;text-align:center;color:var(--text-dim)">Loading exercises…</div>';
    return;
  }

  const switcher=`<div style="display:flex;gap:4px;padding:14px 16px 0;">
    <button data-tab="workout" class="sil-toggle-btn${workoutSubTab==='workout'?' active':''}" onclick="setWorkoutSubTab('workout')" style="flex:1;text-align:center">Workout</button>
    <button data-tab="ranks" class="sil-toggle-btn${workoutSubTab==='ranks'?' active':''}" onclick="setWorkoutSubTab('ranks')" style="flex:1;text-align:center">Ranks</button>
    <button data-tab="volume" class="sil-toggle-btn${workoutSubTab==='volume'?' active':''}" onclick="setWorkoutSubTab('volume')" style="flex:1;text-align:center">Volume</button>
    <!-- <button data-tab="bodymap" class="sil-toggle-btn${workoutSubTab==='bodymap'?' active':''}" onclick="setWorkoutSubTab('bodymap')" style="flex:1;text-align:center">Body Map</button> -->
  </div>`;

  // Day order and labels matching the training protocol
  const DAY_DEFS=[
    {abbr:'Mon',label:'Monday',   sub:'Chest · Triceps · Abs'},
    {abbr:'Tue',label:'Tuesday',  sub:'Back · Biceps · Forearms'},
    {abbr:'Wed',label:'Wednesday',sub:'Legs · Plyometrics · Mild Chest'},
    {abbr:'Thu',label:'Thursday', sub:'Shoulders · Abs'},
    {abbr:'Fri',label:'Friday',   sub:'Back · Carries'},
    {abbr:'Sat',label:'Saturday', sub:'Legs · Plyometrics · Cardio'},
    {abbr:'Sun',label:'Sunday',   sub:'Rest'},
  ];
  const ABBRS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayAbbr=ABBRS[new Date().getDay()];

  // Always build workout panel
  {
    // Init expandedWorkoutDays to today only on first load
    if(expandedWorkoutDays===null){
      expandedWorkoutDays=new Set([todayAbbr]);
    }

    function exCard(e){
      const open=expandedExercise===e.id;
      const meta=[e.primaryMuscle,e.equipment,e.xpPerSet?e.xpPerSet+' XP/set':''].filter(Boolean).join(' · ');
      const secondary=e.musclesHit.filter(m=>m!==e.primaryMuscle);
      const muscleTags=(e.primaryMuscle?`<span class="wec-tag wec-primary">${e.primaryMuscle} ×1.0</span>`:'')
        +secondary.map(m=>`<span class="wec-tag wec-secondary">${m} ×0.5</span>`).join('');
      const prMuscle=e.primaryMuscle;
      const prDef=PR_THRESHOLDS[prMuscle];
      const prVal=prMuscle&&state.prs?.[prMuscle]!=null?state.prs[prMuscle]:null;
      const pbStr=prVal!=null?(prDef?.isReps?`PB  ${prVal} reps`:`PB  ${prVal}kg`):'';
      // Prefill from the last logged session so you never retype what you already did.
      const last=state.lastSets?.[e.name]||null;
      const sugg=overloadSuggestion(e,last);
      const vSets=last?last.sets:3;
      const vReps=last?last.reps:10;
      const vWeight=sugg!=null?sugg:(last?last.weight:0);
      let lastLine='';
      if(last){
        const days=Math.round((new Date(localToday()+'T00:00:00')-new Date(last.date+'T00:00:00'))/86400000);
        let ago='today';
        if(days===1)ago='yesterday';
        else if(days>1)ago=days+'d ago';
        lastLine=`<div class="wec-last">Last: ${last.sets}×${last.reps} @ ${last.weight}kg · ${ago}</div>`;
      }
      let suggLine='';
      if(sugg!=null){
        suggLine=`<div class="wec-sugg">↑ Hit ${last.reps} reps — try ${sugg}kg</div>`;
      }
      const body=open?`<div class="wec-body">
        ${pbStr?`<div style="font-size:8px;font-weight:700;letter-spacing:0.18em;color:var(--text-dim);margin-bottom:8px">${pbStr}</div>`:''}
        ${lastLine}
        ${suggLine}
        <div class="wec-inp-row">
          <div class="wec-inp-grp"><div class="wec-lbl">Sets</div><input type="number" class="wec-inp" id="wec-s-${e.id}" value="${vSets}" min="1" max="30"></div>
          <div class="wec-inp-grp"><div class="wec-lbl">Reps</div><input type="number" class="wec-inp" id="wec-r-${e.id}" value="${vReps}" min="1" max="100"></div>
          <div class="wec-inp-grp"><div class="wec-lbl">kg</div><input type="number" class="wec-inp" id="wec-w-${e.id}" value="${vWeight}" min="0"></div>
        </div>
        <div class="wec-muscles">${muscleTags}</div>
        <button class="wec-log-btn" id="wec-btn-${e.id}" onclick="event.stopPropagation();logExerciseFromTab('${e.id}')">LOG ${e.name.toUpperCase()}</button>
      </div>`:'';
      return `<div class="wec${open?' open':''}" id="wec-${e.id}" onclick="${open?'':'toggleWorkoutExercise(\''+e.id+'\')'}">
        <div class="wec-row"><div>
          <div class="wec-name">${e.name}</div>
          ${meta?`<div class="wec-meta">${meta}</div>`:''}
        </div><span class="wec-arrow">▾</span></div>
        ${body}
      </div>`;
    }

    let html='';
    DAY_DEFS.forEach(({abbr,label,sub})=>{
      const dayEx=state.exercises.filter(e=>e.day.includes(abbr));
      if(!dayEx.length)return;
      const isToday=abbr===todayAbbr;
      const isOpen=expandedWorkoutDays.has(abbr);
      const headerCls=`wec-day-header${isToday?' today':''}${isOpen?' open':''}`;
      html+=`<div class="wec-day-section">
        <div class="${headerCls}" onclick="toggleWorkoutDay('${abbr}')">
          <div class="wec-day-header-left">
            <div class="wec-day-dot"></div>
            <div class="wec-day-title">${label}${isToday?' <span style="font-size:8px;opacity:0.7;letter-spacing:0.05em;text-transform:none;font-weight:400">· today</span>':''}</div>
            <span class="wec-day-label-sub">${sub}</span>
          </div>
          <div class="wec-day-right">
            <span class="wec-day-count">${dayEx.length}</span>
            <span class="wec-day-chevron">▾</span>
          </div>
        </div>
        ${(()=>{
          if(!isOpen)return'';
          // group by primaryMuscle
          const groups=[];
          const seen=new Map();
          dayEx.forEach(e=>{
            const key=e.primaryMuscle||'Other';
            if(!seen.has(key)){seen.set(key,[]); groups.push(key);}
            seen.get(key).push(e);
          });
          let body='';
          groups.forEach(muscle=>{
            body+=`<div class="wec-muscle-group-label">${muscle}</div>`;
            body+=seen.get(muscle).map(exCard).join('');
          });
          return`<div class="wec-day-body">${body}</div>`;
        })()}
      </div>`;
    });

    const unscheduled=state.exercises.filter(e=>!e.day||e.day.length===0);
    if(unscheduled.length){
      const isOpen=expandedWorkoutDays.has('__other__');
      const headerCls=`wec-day-header${isOpen?' open':''}`;
      html+=`<div class="wec-day-section">
        <div class="${headerCls}" onclick="toggleWorkoutDay('__other__')">
          <div class="wec-day-header-left">
            <div class="wec-day-dot" style="background:var(--text-dim);opacity:0.3"></div>
            <div class="wec-day-title" style="opacity:0.5">Other Exercises</div>
            <span class="wec-day-label-sub">Not in current split</span>
          </div>
          <div class="wec-day-right">
            <span class="wec-day-count">${unscheduled.length}</span>
            <span class="wec-day-chevron">▾</span>
          </div>
        </div>
        ${isOpen?`<div class="wec-day-body">${unscheduled.map(exCard).join('')}</div>`:''}
      </div>`;
    }

    workoutPanelHTML=html;
  }

  // ── Body Map sub-tab ──
  const bodyStats=state.bodyStats;
  const selStat=selectedMuscle?bodyStats.find(x=>x.id===selectedMuscle):null;
  // (body map render removed — see bodymap-archive.js)

  // ── Volume panel: rolling 28-day tonnage per muscle ──────────────────────
  // Answers "am I actually training this enough" — especially for muscles that sit
  // on every day (shoulders/forearms) vs ones on a single day.
  let volumeHTML='<div style="padding:16px">';
  const statIdToName={};
  (state.bodyStats||[]).forEach(s=>{statIdToName[s.id]=s.name;});
  const volRows=Object.entries(state.volume||{})
    .map(([id,v])=>({name:statIdToName[id]||null,tonnage:v.tonnage,sets:v.sets,days:v.days.size}))
    .filter(r=>r.name&&r.tonnage>0)
    .sort((a,b)=>b.tonnage-a.tonnage);
  if(!volRows.length){
    volumeHTML+='<div style="color:var(--text-dim);font-size:11px;text-align:center;padding:32px 0">No sets logged in the last 28 days.</div>';
  }else{
    const maxTon=volRows[0].tonnage;
    volumeHTML+=`<div style="font-size:8px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px">Volume · last 28 days</div>
      <div style="font-size:9px;color:var(--text-dim);margin-bottom:14px">Tonnage = sets × reps × kg. Secondary muscles count half.</div>`;
    volRows.forEach(r=>{
      const pct=Math.max(2,Math.round(r.tonnage/maxTon*100));
      const tons=r.tonnage>=1000?(r.tonnage/1000).toFixed(1)+'t':Math.round(r.tonnage)+'kg';
      volumeHTML+=`<div style="margin-bottom:11px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
          <span style="font-size:11px;color:var(--text)">${r.name}</span>
          <span style="font-size:9px;color:var(--text-dim)">${tons} · ${Math.round(r.sets)} sets · ${r.days}d</span>
        </div>
        <div style="height:4px;background:var(--bg-soft,#1a1a1a);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--gold)"></div>
        </div>
      </div>`;
    });
  }
  volumeHTML+='</div>';

  // ── Ranks panel: body part average, individual muscles on tap ────────────
  let ranksHTML='<div style="padding:16px">';
  const byName={};(state.bodyStats||[]).forEach(s=>{byName[s.name]=s;});
  const groups=BODY_PARTS.map(bp=>({
    name:bp.name,
    stats:bp.muscles.map(m=>byName[m]).filter(Boolean)
  })).filter(g=>g.stats.length);
  if(!groups.length){
    ranksHTML+='<div style="color:var(--text-dim);font-size:11px;text-align:center;padding:32px 0">Body stats not loaded.</div>';
  }else{
    const overall=averageRank(groups.flatMap(g=>g.stats));
    if(overall){
      ranksHTML+=`<div class="rk-overall">
        <div class="rk-badge">${badgeSVG(overall.rank,46)}</div>
        <div>
          <div class="rk-overall-lbl">Overall</div>
          <div class="rk-overall-rank" style="color:${overall.rank.color}">${overall.rank.name} ${overall.rank.roman}</div>
          <div class="rk-overall-sub">${overall.count} muscles tracked</div>
        </div>
      </div>`;
    }
    groups.forEach(g=>{
      const avg=averageRank(g.stats);
      const open=!!_ranksOpen[g.name];
      // Position on the 24-rank ladder, as a share of the way to Olympian III.
      const pct=Math.round(avg.mean/(ALL_RANKS.length-1)*100);
      ranksHTML+=`<div class="rk-group">
        <div class="rk-head" onclick="toggleRankGroup('${g.name}')">
          <div class="rk-badge-sm">${badgeSVG(avg.rank,26)}</div>
          <div style="flex:1;min-width:0">
            <div class="rk-name">${g.name}</div>
            <div class="rk-rank" style="color:${avg.rank.color}">${avg.rank.name} ${avg.rank.roman} <span class="rk-count">· ${g.stats.length}</span></div>
          </div>
          <span class="rk-chev">${open?'▾':'▸'}</span>
        </div>
        <div class="rk-bar"><div class="rk-bar-fill" style="width:${pct}%;background:${avg.rank.color}"></div></div>`;
      if(open){
        ranksHTML+='<div class="rk-list">';
        // Weakest first — that's the one worth training.
        g.stats.map(s=>{
          const r=muscleRank(s);
          return {s,r,i:ALL_RANKS.findIndex(x=>x.name===r.name&&x.roman===r.roman)};
        }).sort((a,b)=>a.i-b.i).forEach(({s,r,i})=>{
          const w=Math.round(i/(ALL_RANKS.length-1)*100);
          let stale='';
          if(s.daysInactive!=null&&s.daysInactive>=10)stale=`<span class="rk-stale">${s.daysInactive}d</span>`;
          ranksHTML+=`<div class="rk-item">
            <span class="rk-item-n">${esc(s.name)}</span>
            <span class="rk-item-r" style="color:${r.color}">${r.name} ${r.roman}</span>
            ${stale}
            <span class="rk-item-bar"><span style="width:${w}%;background:${r.color}"></span></span>
          </div>`;
        });
        ranksHTML+='</div>';
      }
      ranksHTML+='</div>';
    });
  }
  ranksHTML+='</div>';

  const PANES=['workout','ranks','volume'];
  const paneIdx=Math.max(0,PANES.indexOf(workoutSubTab));
  const translateX=`-${paneIdx*(100/PANES.length)}%`;
  el.innerHTML=switcher+`<div style="overflow:hidden;width:100%">
    <div id="workout-slider" style="display:flex;width:300%;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);transform:translateX(${translateX})">
      <div style="width:33.3333%;flex-shrink:0;min-width:0">${workoutPanelHTML}</div>
      <div style="width:33.3333%;flex-shrink:0;min-width:0">${ranksHTML}</div>
      <div style="width:33.3333%;flex-shrink:0;min-width:0">${volumeHTML}</div>
    </div>
  </div>`;

  // Touch swipe handling
  const slider=document.getElementById('workout-slider');
  if(slider){
    let startX=0,startY=0,locked=false,dir=null;
    slider.parentElement.addEventListener('touchstart',function(e){
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      locked=false;dir=null;
    },{passive:true});
    slider.parentElement.addEventListener('touchmove',function(e){
      if(locked)return;
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(dir===null){
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8){dir='h';}
        else if(Math.abs(dy)>8){dir='v';locked=true;}
      }
      if(dir==='h')e.preventDefault();
    },{passive:false});
    slider.parentElement.addEventListener('touchend',function(e){
      if(locked||dir!=='h')return;
      const dx=e.changedTouches[0].clientX-startX;
      const _p=['workout','ranks','volume'];
      const _cur=Math.max(0,_p.indexOf(workoutSubTab));
      if(dx<-40&&_cur<_p.length-1)setWorkoutSubTab(_p[_cur+1]);
      else if(dx>40&&_cur>0)setWorkoutSubTab(_p[_cur-1]);
    },{passive:true});
  }
}


/* ── Journal Helpers ── */
const EMO_COLOR={Joy:'blue',Excitement:'blue',Happiness:'blue',Gratitude:'green',Calmness:'green',Confidence:'green',Disappointment:'yellow',Anxiety:'yellow',Sadness:'yellow',Frustration:'yellow',Jealousy:'orange',Anger:'orange',Fear:'red',Panic:'red',Despair:'red',Boredom:'default'};

function toggleJournalEmotion(name){
  if(journalSelectedEmotions.has(name))journalSelectedEmotions.delete(name);
  else journalSelectedEmotions.add(name);
  renderJournal();
}
function selectJournalBook(id){
  journalSelectedJournalId=journalSelectedJournalId===id?null:id;
  renderJournal();
}
async function saveJournalEntry(){
  const title=document.getElementById('jnlTitle').value.trim();
  const date=document.getElementById('jnlDate').value;
  const body=document.getElementById('jnlBody').value.trim();
  if(!title){document.getElementById('jnlTitle').focus();return;}
  const btn=document.getElementById('jnlSaveBtn');
  btn.disabled=true;btn.textContent='Saving…';
  try{
    const props={
      Name:{title:[{text:{content:title}}]},
      ...(date?{Date:{date:{start:date}}}:{}),
      ...(journalSelectedEmotions.size?{Emotions:{multi_select:[...journalSelectedEmotions].map(n=>({name:n}))}}:{}),
      ...(journalSelectedJournalId?{Journal:{relation:[{id:journalSelectedJournalId}]}}:{}),
    };
    const page=await nCreate(DB.entries,props);
    if(body&&page?.id){
      const paragraphs=body.split('\n').filter(l=>l.trim()).map(l=>({type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:l}}]}}));
      if(paragraphs.length)await nAddBlocks(page.id,paragraphs).catch(()=>{});
    }
    journalFormOpen=false;journalSelectedEmotions=new Set();journalSelectedJournalId=null;
    await Promise.all([loadJournals(),loadEntries()]);renderJournal();
  }catch(e){btn.disabled=false;btn.textContent='Save Entry';alert('Error: '+e.message);}
}

function renderJournal(){
  const el=document.getElementById('tab-journal');
  const today=localToday();
  const allEmos=Object.keys(EMO_COLOR);

  if(journalFormOpen){
    const books=state.journals;
    let bookChips=books.length
      ?books.map(b=>`<button class="jnl-book-chip ${journalSelectedJournalId===b.id?'selected':''}" onclick="selectJournalBook('${b.id}')">${b.name}</button>`).join('')
      :'<span style="color:var(--text-dim);font-size:11px">No journals found</span>';
    let emoButtons=allEmos.map(e=>{
      const c=EMO_COLOR[e];
      const sel=journalSelectedEmotions.has(e);
      return `<button class="jnl-emo-btn ${sel?'sel-'+c:''}" onclick="toggleJournalEmotion('${e}')">${e}</button>`;
    }).join('');
    el.innerHTML=`
    <button class="jnl-back-btn" onclick="journalFormOpen=false;renderJournal()">← Back</button>
    <div class="jnl-form">
      <div>
        <div class="jnl-form-label">Title</div>
        <input id="jnlTitle" class="jnl-input" placeholder="Entry title…" type="text"/>
      </div>
      <div>
        <div class="jnl-form-label">Date</div>
        <input id="jnlDate" class="jnl-input" type="date" value="${today}"/>
      </div>
      <div>
        <div class="jnl-form-label">Journal</div>
        <div class="jnl-book-chips">${bookChips}</div>
      </div>
      <div>
        <div class="jnl-form-label">Emotions</div>
        <div class="jnl-emo-grid">${emoButtons}</div>
      </div>
      <div>
        <div class="jnl-form-label">Body</div>
        <textarea id="jnlBody" class="jnl-input jnl-textarea" placeholder="Write your entry…"></textarea>
      </div>
      <button class="jnl-save-btn" id="jnlSaveBtn" onclick="saveJournalEntry()">Save Entry</button>
    </div>`;
    return;
  }

  // List view
  let html=`<button class="jnl-new-btn" onclick="journalFormOpen=true;renderJournal()">+ New Entry</button>`;
  const entries=state.entries;
  if(!entries.length){html+=`<div class="jnl-empty">No entries yet.<br>Tap + New Entry to start.</div>`;el.innerHTML=html;return;}

  // Group by date label
  const groups=[];const seen={};
  entries.forEach(e=>{
    const d=e.date??'';
    let label='Unknown';
    if(d){
      if(d===today)label='Today';
      else{
        const diff=Math.round((new Date(today)-new Date(d))/(864e5));
        if(diff===1)label='Yesterday';
        else if(diff<=7)label='This Week';
        else{const dt=new Date(d+'T00:00:00');label=dt.toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
      }
    }
    if(!seen[label]){seen[label]=true;groups.push({label,entries:[]});}
    groups[groups.length-1].entries.push(e);
  });

  groups.forEach(g=>{
    html+=`<div class="jnl-day-label">${g.label}</div>`;
    g.entries.forEach(e=>{
      const chips=e.emotions.map(em=>{
        const c=EMO_COLOR[em]??'default';
        const colors={blue:'#4a8fe0',green:'#4caf7d',yellow:'#d4a800',orange:'#e07840',red:'#e05555',default:'#888'};
        return `<span class="jnl-emotion-chip" style="color:${colors[c]};background:${colors[c]}18;border:1px solid ${colors[c]}44">${em}</span>`;
      }).join('');
      const dateStr=e.date?new Date(e.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
      html+=`<div class="jnl-card"><div class="jnl-card-title">${e.name}</div>${dateStr?`<div class="jnl-card-meta">${dateStr}</div>`:''}${chips?`<div class="jnl-emotions">${chips}</div>`:''}</div>`;
    });
  });
  el.innerHTML=html;
}

function renderStudyLog(){
  const el=document.getElementById('tab-study');

  function dayKey(iso){return iso?iso.split('T')[0]:'';}
  function fmtDay(d){
    const dt=new Date(d+'T00:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const diff=Math.round((dt-today)/86400000);
    if(diff===0)return'Today';if(diff===-1)return'Yesterday';
    return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  }
  function fmtTime(iso){if(!iso)return'';return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
  function msDur(s){return sessionMs(s);}
  function totalMs(arr){return arr.reduce((a,s)=>a+msDur(s),0);}

  const done=state.sessions.filter(s=>s.complete==='Done'&&s.started);
  const groups={};
  done.forEach(s=>{const k=dayKey(s.started);if(!groups[k])groups[k]=[];groups[k].push(s);});
  const days=Object.keys(groups).sort((a,b)=>b.localeCompare(a));

  const todayStr=localToday();
  const todayDone=done.filter(s=>s.started&&localDay(s.started)===todayStr);
  const todayCount=todayDone.length+(state.activeSession&&localDay(state.activeSession.startedAt||'')===todayStr?1:0);
  const isPomoActive=pomoMode&&(state.activeSession||pomoPhaseEnd);
  const isBreak=pomoMode&&!state.activeSession&&pomoPhaseEnd;
  const CIRC=628.318;

  let html='';

  if(isPomoActive){
    const totalMs2=pomoPhase==='work'?POMO_WORK:(pomoCount%4===0?POMO_LONG:POMO_SHORT);
    const rem=pomoPhaseEnd?Math.max(0,pomoPhaseEnd-Date.now()):0;
    const pct=pomoPhaseEnd?Math.min(1,(totalMs2-rem)/totalMs2):0;
    const initOffset=(CIRC*pct).toFixed(2);
    const blockPos=pomoCount%4;
    const dots=Array.from({length:4},(_,i)=>`<div class="pomo-screen-dot${i<blockPos?' filled':''}"></div>`).join('');
    const subject=state.activeSession?.subject||(lastSubject||'');
    const phaseLabel=isBreak?(pomoCount%4===0?'Long Break':'Short Break'):'Focus';
    const ringColor=isBreak?'var(--green-text)':'var(--gold)';
    const ringGlow=isBreak?'#1a3a28':'var(--gold-dim)';
    const countdownTxt=formatDuration(rem);

    // Orbital dot initial position
    const ORB_R=114;
    const orbAngle=-Math.PI/2+pct*2*Math.PI;
    const orbX=(120+ORB_R*Math.cos(orbAngle)).toFixed(2);
    const orbY=(120+ORB_R*Math.sin(orbAngle)).toFixed(2);
    const sundialTicks=Array.from({length:60},(_,i)=>{
      const a=(i*6-90)*Math.PI/180;
      const isQ=i%15===0,isMaj=i%5===0;
      const r1=isQ?88:isMaj?91:93,r2=97;
      return`<line x1="${(120+r1*Math.cos(a)).toFixed(1)}" y1="${(120+r1*Math.sin(a)).toFixed(1)}" x2="${(120+r2*Math.cos(a)).toFixed(1)}" y2="${(120+r2*Math.sin(a)).toFixed(1)}" stroke="${isQ?ringColor:'var(--border-hi)'}" stroke-width="${isQ?1.5:isMaj?0.8:0.4}" opacity="${isQ?0.8:0.6}"/>`;
    }).join('');
    html+=`<div class="pomo-screen">
      <div class="pomo-screen-phase">${phaseLabel}</div>
      <div class="pomo-screen-subject">${subject}</div>
      <div class="pomo-ring-wrap">
        <svg class="pomo-ring" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" overflow="visible">
          <defs>
            <filter id="ring-glow-f" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="orb-glow" x="-200%" y="-200%" width="500%" height="500%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="orb-bloom" x="-150%" y="-150%" width="400%" height="400%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Faint orbit path -->
          <circle cx="120" cy="120" r="${ORB_R}" fill="none" stroke="${ringColor}" stroke-width="0.6" opacity="0.10" stroke-dasharray="3 5"/>
          <!-- Main ring bg -->
          <circle class="pomo-ring-bg" cx="120" cy="120" r="100"/>
          ${sundialTicks}
          <!-- Progress arc -->
          <circle class="pomo-ring-track" cx="120" cy="120" r="100"
            transform="rotate(-90 120 120)"
            stroke-dasharray="${CIRC}"
            stroke-dashoffset="${initOffset}"
            stroke="${ringColor}"
            id="pomo-ring-fill"
            filter="url(#ring-glow-f)"/>
          <!-- Orbital outer glow -->
          <circle id="pomo-orbit-glow" cx="${orbX}" cy="${orbY}" r="11" fill="${ringColor}" opacity="0.18" filter="url(#orb-glow)"/>
          <!-- Orbital halo -->
          <circle id="pomo-orbit-halo" cx="${orbX}" cy="${orbY}" r="5.5" fill="${ringColor}" opacity="0.55" filter="url(#orb-bloom)"/>
          <!-- Orbital core -->
          <circle id="pomo-orbit-dot" cx="${orbX}" cy="${orbY}" r="3" fill="#ffffff" opacity="0.95"/>
        </svg>
        <div class="pomo-ring-time">
          <div id="timer-display-log" class="pomo-ring-countdown">${countdownTxt}</div>
          <div class="pomo-ring-label">${isBreak?'rest':'remaining'}</div>
        </div>
      </div>
      <div class="pomo-screen-dots">${dots}</div>
      <div class="pomo-screen-today">${todayCount > 0 ? todayCount+' pomo'+(todayCount>1?'s':'')+' today' : 'first pomo!'}</div>
      <button class="pomo-screen-stop" onclick="handlePomoStop()">${isBreak?'skip break':'stop'}</button>
      ${days.length?'<div class="pomo-log-divider"></div>':''}
    </div>`;
  } else if(state.activeSession){
    // free mode active
    const ms=Date.now()-new Date(state.activeSession.startedAt).getTime();
    const tot=Math.floor(ms/1000);
    const hh=Math.floor(tot/3600),mm=Math.floor((tot%3600)/60),ss=tot%60;
    const hhStr=hh>0?String(hh).padStart(2,'0')+':':'';
    const mmStr=String(mm).padStart(2,'0');
    const ssStr=String(ss).padStart(2,'0');
    html+=`<div class="pomo-free-active">
      <div class="free-timer-subject">${state.activeSession.subject}</div>
      <div class="free-timer-wrap">
        <div id="timer-display-log" class="free-timer-digits">${hhStr}${mmStr}<span class="free-timer-sep"> </span>${ssStr}</div>
        <div class="free-timer-bar"><div class="free-timer-bar-fill" id="free-timer-bar-fill"></div></div>
      </div>
      <button class="free-timer-stop" onclick="stopSession()">end</button>
      ${days.length?'<div class="pomo-log-divider"></div>':''}
    </div>`;
  }

  // 14-day study bars
  {
    const BAR_DAYS=14;
    const today2=new Date();today2.setHours(0,0,0,0);
    const barData=[];
    let maxH=0;
    for(let i=BAR_DAYS-1;i>=0;i--){
      const d=new Date(today2);d.setDate(d.getDate()-i);
      const ds=localDay(d);
      const daySess=done.filter(s=>s.started&&localDay(s.started)===ds&&s.done);
      const flowH=daySess.filter(s=>s.quality==='Flow').reduce((a,s)=>a+sessionH(s),0);
      const grindH=daySess.filter(s=>s.quality==='Grind').reduce((a,s)=>a+sessionH(s),0);
      const otherH=daySess.filter(s=>!s.quality||s.quality==='Distracted').reduce((a,s)=>a+sessionH(s),0);
      const total=flowH+grindH+otherH;
      if(total>maxH)maxH=total;
      const dayLabel=i===0?'T':i===1?'Y':d.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,1);
      barData.push({ds,flowH,grindH,otherH,total,dayLabel,isToday:i===0});
    }
    const scale=maxH>0?44/maxH:0;
    const barsHTML=barData.map(b=>{
      const fH=Math.max(0,Math.round(b.flowH*scale));
      const gH=Math.max(0,Math.round(b.grindH*scale));
      const oH=Math.max(0,Math.round(b.otherH*scale));
      const totalPx=fH+gH+oH;
      const barContent=totalPx>0
        ?`<div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:${totalPx}px;border-radius:2px 2px 0 0;overflow:hidden">
            ${oH>0?`<div style="height:${oH}px;background:rgba(180,90,70,0.5)"></div>`:''}
            ${gH>0?`<div style="height:${gH}px;background:rgba(232,234,240,0.28)"></div>`:''}
            ${fH>0?`<div style="height:${fH}px;background:rgba(232,234,240,0.75)"></div>`:''}
          </div>`
        :`<div style="width:100%;height:2px;background:rgba(255,255,255,0.05);border-radius:1px"></div>`;
      return`<div class="study-bar-col" style="${b.isToday?'opacity:1':'opacity:0.65'}">
        <div style="height:44px;display:flex;align-items:flex-end;width:100%">${barContent}</div>
        <div class="study-bar-day" style="${b.isToday?'color:var(--gold-dim)':''}">${b.dayLabel}</div>
      </div>`;
    }).join('');
    // 7-day trend
    const todayD=new Date();todayD.setHours(0,0,0,0);
    const prev14Start=new Date(todayD);prev14Start.setDate(prev14Start.getDate()-14);
    const prev7Start=new Date(todayD);prev7Start.setDate(prev7Start.getDate()-7);
    const last7=done.filter(s=>s.quality&&s.started&&new Date(s.started)>=prev7Start);
    const prev7=done.filter(s=>s.quality&&s.started&&new Date(s.started)>=prev14Start&&new Date(s.started)<prev7Start);
    const flowRateNow=last7.length>0?last7.filter(s=>s.quality==='Flow').length/last7.length:null;
    const flowRatePrev=prev7.length>0?prev7.filter(s=>s.quality==='Flow').length/prev7.length:null;
    let trendHTML='';
    if(flowRateNow!==null){
      const pct=Math.round(flowRateNow*100);
      if(flowRatePrev!==null){
        const diff=Math.round((flowRateNow-flowRatePrev)*100);
        const arrow=diff>0?'↑':diff<0?'↓':'→';
        const col=diff>0?'var(--gold)':diff<0?'rgba(180,90,70,0.9)':'var(--text-dim)';
        trendHTML=`<span style="font-size:8px;color:${col};letter-spacing:0.04em;">${arrow} ${Math.abs(diff)}% flow vs prev week</span>`;
      } else {
        trendHTML=`<span style="font-size:8px;color:var(--text-dim);letter-spacing:0.04em;">${pct}% flow this week</span>`;
      }
    }
    if(maxH>0||done.length){
      html+=`<div class="study-bars-wrap">
        <div class="study-bars-label" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Last 14 days</span>${trendHTML}
        </div>
        <div class="study-bars">${barsHTML}</div>
      </div>`;
    }
  }

  // Focus heatmap
  const tagged=done.filter(s=>s.quality&&s.started);
  if(tagged.length>=3){
    const DAY_START=5*60,DAY_END=24*60,DAY_SPAN=DAY_END-DAY_START;
    const qCol={Flow:'var(--gold)',Grind:'rgba(232,234,240,0.35)',Distracted:'rgba(180,90,70,0.55)'};
    const qH={Flow:10,Grind:6,Distracted:7};
    const ticks=tagged.map(s=>{
      const d=new Date(s.started);
      const mins=d.getHours()*60+d.getMinutes();
      const pct=Math.min(100,Math.max(0,((mins-DAY_START)/DAY_SPAN)*100));
      const h=qH[s.quality]||6;
      return`<div style="position:absolute;left:${pct.toFixed(1)}%;bottom:0;width:2px;height:${h}px;background:${qCol[s.quality]||'rgba(255,255,255,0.2)'};border-radius:1px;opacity:0.75;"></div>`;
    }).join('');
    // Hour labels
    const hourLabels=[6,9,12,15,18,21].map(h=>{
      const pct=((h*60-DAY_START)/DAY_SPAN*100).toFixed(1);
      return`<div style="position:absolute;left:${pct}%;font-size:7px;color:rgba(255,255,255,0.12);transform:translateX(-50%)">${h<12?h+'am':h===12?'12pm':(h-12)+'pm'}</div>`;
    }).join('');
    // Peak focus: find 2h window with most Flow sessions
    const flowMins=tagged.filter(s=>s.quality==='Flow').map(s=>{const d=new Date(s.started);return d.getHours()*60+d.getMinutes();});
    let peakStr='';
    if(flowMins.length>=2){
      let best=0,bestH=9;
      for(let h=5;h<23;h++){
        const count=flowMins.filter(m=>m>=h*60&&m<(h+2)*60).length;
        if(count>best){best=count;bestH=h;}
      }
      const fmt=h=>h<12?`${h}am`:h===12?'12pm':`${h-12}pm`;
      if(best>0)peakStr=`Peak focus ${fmt(bestH)}–${fmt(bestH+2)}`;
    }
    const distractedMins=tagged.filter(s=>s.quality==='Distracted').map(s=>{const d=new Date(s.started);return d.getHours()*60+d.getMinutes();});
    let avoidStr='';
    if(distractedMins.length>=2){
      let worst=0,worstH=21;
      for(let h=5;h<23;h++){
        const count=distractedMins.filter(m=>m>=h*60&&m<(h+2)*60).length;
        if(count>worst){worst=count;worstH=h;}
      }
      const fmt=h=>h<12?`${h}am`:h===12?'12pm':`${h-12}pm`;
      if(worst>0)avoidStr=`Avoid ${fmt(worstH)}–${fmt(worstH+2)}`;
    }
    html+=`<div style="padding:16px 0 20px;">
      <div style="font-size:7px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;">FOCUS PATTERN</div>
      <div style="position:relative;height:14px;background:rgba(255,255,255,0.04);border-radius:2px;margin-bottom:6px;">${ticks}</div>
      <div style="position:relative;height:10px;">${hourLabels}</div>
      <div style="display:flex;gap:14px;margin-top:10px;align-items:center;flex-wrap:wrap;">
        <div style="display:flex;gap:10px;">
          <span style="font-size:7px;color:var(--gold);display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:1px;"></span>Flow</span>
          <span style="font-size:7px;color:rgba(232,234,240,0.4);display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:8px;height:8px;background:rgba(232,234,240,0.35);border-radius:1px;"></span>Grind</span>
          <span style="font-size:7px;color:rgba(180,90,70,0.8);display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:8px;height:8px;background:rgba(180,90,70,0.55);border-radius:1px;"></span>Distracted</span>
        </div>
        <div style="flex:1;text-align:right;font-size:8px;color:var(--text-dim);letter-spacing:0.04em;">
          ${peakStr?`<span style="color:var(--gold)">${peakStr}</span>`:''}${peakStr&&avoidStr?' · ':''}${avoidStr?`<span style="color:rgba(180,90,70,0.8)">${avoidStr}</span>`:''}
        </div>
      </div>
    </div>`;
  }

  // Quality by subject (hidden when session active)
  if(!state.activeSession){
  {
    const qSess=done.filter(s=>s.quality&&(s.subject||s.name));
    if(qSess.length>=3){
      const subMap={};
      qSess.forEach(s=>{
        const sub=s.subject||s.name||'Study';
        if(!subMap[sub])subMap[sub]={flow:0,grind:0,distracted:0,sessions:0};
        const dur=msDur(s)/3600000;
        if(s.quality==='Flow')subMap[sub].flow+=dur;
        else if(s.quality==='Grind')subMap[sub].grind+=dur;
        else subMap[sub].distracted+=dur;
        subMap[sub].sessions++;
      });
      const subs=Object.entries(subMap)
        .map(([name,q])=>({name,total:q.flow+q.grind+q.distracted,flow:q.flow,grind:q.grind,distracted:q.distracted,sessions:q.sessions}))
        .filter(s=>s.sessions>=2)
        .sort((a,b)=>b.sessions-a.sessions)
        .slice(0,7);
      if(subs.length>=2){
        const rows=subs.map(s=>{
          const t=s.total||0.001;
          const fP=(s.flow/t*100).toFixed(0);
          const gP=(s.grind/t*100).toFixed(0);
          const dP=(s.distracted/t*100).toFixed(0);
          const flowRatio=s.flow/t;
          const fcol=flowRatio>=0.6?'var(--gold)':flowRatio>=0.35?'rgba(232,234,240,0.55)':'var(--text-dim)';
          const truncName=s.name.length>22?s.name.slice(0,20)+'…':s.name;
          const fSeg=fP>0?'<div style="width:'+fP+'%;height:100%;background:rgba(232,234,240,0.72);"></div>':'';
          const gSeg=gP>0?'<div style="width:'+gP+'%;height:100%;background:rgba(232,234,240,0.22);"></div>':'';
          const dSeg=dP>0?'<div style="width:'+dP+'%;height:100%;background:rgba(180,90,70,0.48);"></div>':'';
          return`<div style="margin-bottom:9px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;">
              <div style="font-size:10px;font-weight:500;color:var(--text);">${truncName}</div>
              <div style="font-size:8px;color:${fcol};letter-spacing:0.04em;flex-shrink:0;margin-left:8px;">${fP}% flow</div>
            </div>
            <div style="height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;display:flex;">${fSeg}${gSeg}${dSeg}</div>
          </div>`;
        }).join('');
        html+=`<div style="padding:0 0 22px;">
          <div style="font-size:7px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim);margin-bottom:13px;">QUALITY BY SUBJECT</div>
          ${rows}
        </div>`;
      }
    }
  }
  } // end !state.activeSession block for quality by subject

  if(!days.length&&!isPomoActive&&!state.activeSession){
    html+=`<div style="text-align:center;padding:60px 20px;color:var(--text-dim);font-size:12px;letter-spacing:0.06em;">No sessions yet</div>`;
  }

  if(!state.activeSession) days.forEach(day=>{
    const arr=groups[day];
    const tot=totalMs(arr);
    html+=`<div class="study-day-group">
      <div class="study-day-header">
        <div class="study-day-label">${fmtDay(day)}</div>
        <div class="study-day-total">${formatDuration(tot)}</div>
      </div>`;
    arr.forEach(s=>{
      const dur=msDur(s);
      const qCls=s.quality?(s.quality.toLowerCase()):'';
      // Be explicit when a timer clearly ran on — don't silently show a fake number.
      let capNote='';
      if(isRunaway(s))capNote=`<span class="session-capped" title="Timer left running — counted as ${SESSION_CAP_H}h">timer ran ${Math.round(sessionRawH(s))}h · capped</span>`;
      html+=`<div class="session-card">
        <div class="session-dur">${dur>0?formatDuration(dur):'—'}</div>
        <div class="session-body">
          <div class="session-subject">${s.subject||s.name||'Study'}</div>
          <div class="session-time">${fmtTime(s.started)}${s.done?' → '+fmtTime(s.done):''}${capNote}</div>
        </div>
        ${s.quality?`<span class="session-quality ${qCls}">${s.quality}</span>`:''}
      </div>`;
    });
    html+=`</div>`;
  });

  el.innerHTML=html;

  // set ring offset without transition on first paint, then re-enable
  if(isPomoActive){
    const ring=document.getElementById('pomo-ring-fill');
    if(ring){
      const totalMs2=pomoPhase==='work'?POMO_WORK:(pomoCount%4===0?POMO_LONG:POMO_SHORT);
      const rem=pomoPhaseEnd?Math.max(0,pomoPhaseEnd-Date.now()):0;
      const pct=pomoPhaseEnd?Math.min(1,(totalMs2-rem)/totalMs2):0;
      ring.style.transition='none';
      ring.setAttribute('stroke-dashoffset',(CIRC*pct).toFixed(2));
      setTimeout(()=>{if(ring.isConnected)ring.style.transition='stroke-dashoffset 0.95s linear';},50);
    }
  }
}

function getExamStudyHours(exam){
  const examSubs=(exam.subjects||[]).map(s=>s.toLowerCase().trim());
  // Directly compare against real subject/name values from the studied DB (no SUBJECTS constant needed)
  const done=(state.sessions||[]).filter(s=>{
    if(s.complete!=='Done'||!s.started||!s.done)return false;
    const subj=(s.subject||s.name||'').toLowerCase().trim();
    if(!subj)return false;
    return examSubs.some(es=>es===subj||es.includes(subj)||subj.includes(es));
  });
  // Last 4 weeks total (more relevant than all-time)
  const cutoff4w=new Date();cutoff4w.setDate(cutoff4w.getDate()-28);cutoff4w.setHours(0,0,0,0);
  const total=done.filter(s=>new Date(s.started)>=cutoff4w)
    .reduce((sum,s)=>sum+sessionH(s),0);
  // This week = Mon–Sun calendar week
  const weekDates=getWeekDates(0);
  const mon=weekDates[0],sun=weekDates[6];
  const recent=done.filter(s=>{const d=s.started.split('T')[0];return d>=mon&&d<=sun;})
    .reduce((sum,s)=>sum+sessionH(s),0);
  return{total,recent};
}

function renderExams(){
  const el=document.getElementById('tab-exams');
  const today=new Date(); today.setHours(0,0,0,0);
  const upcoming=state.exams.filter(e=>!e.archive);
  const past=state.exams.filter(e=>e.archive);

  function parseDay(d){
    if(!d)return null;
    const dt=new Date(d.split('T')[0]+'T00:00:00');
    return isNaN(dt)?null:dt;
  }
  function fmtDate(d){return fmtExamDateTime(d)||'—';}
  function countdown(d){
    const dt=parseDay(d);
    if(!dt)return null;
    return Math.round((dt-today)/(1000*60*60*24));
  }

  const GRADE_COLORS={1:'g1',2:'g2',3:'g3',4:'g4',5:'g5'};

  function examCard(exam){
    const isUpcoming=!exam.archive;
    const days=countdown(exam.date);
    const gradeNum=exam.grade?parseInt(exam.grade):null;
    const gradeClass=gradeNum?GRADE_COLORS[gradeNum]??'':'';
    const{total:prepTotal,recent:prepRecent}=getExamStudyHours(exam);
    const fmtH=h=>{if(h<0.05)return'0h';const hrs=Math.floor(h);const mins=Math.round((h-hrs)*60);return hrs>0?(mins>0?`${hrs}h ${mins}m`:`${hrs}h`):(mins+'m');};

    const leftCol=isUpcoming
      ?`<div class="exam-countdown">
          <div class="exam-countdown-num">${days!==null?(days===0?'0':days<0?Math.abs(days):days):'—'}</div>
          <div class="exam-countdown-label">${days===null?'':days<0?'ago':days===1?'day':'days'}</div>
        </div>`
      :`<div class="exam-countdown past-badge">
          ${gradeNum?`<div class="exam-grade ${gradeClass}">${gradeNum}</div>`:'<div class="exam-grade" style="color:var(--text-dim)">—</div>'}
          ${exam.percentage!=null?`<div class="exam-pct">${exam.percentage}%</div>`:''}
        </div>`;

    const tagsHTML=[
      ...exam.tags.map(t=>`<span class="exam-tag type-tag">${t}</span>`),
      ...exam.subjects.map(s=>`<span class="exam-tag subj-tag">${s}</span>`)
    ].join('');

    // Prep row for upcoming exams
    const isNegligent=days!==null&&days<=5&&prepTotal<5||days!==null&&days<=10&&prepTotal<2;
    const prepRow=isUpcoming&&exam.subjects.length?`<div class="exam-prep-row">
      <div class="exam-prep-stat">
        <div class="exam-prep-num">${fmtH(prepTotal)}</div>
        <div class="exam-prep-label">4 weeks</div>
      </div>
      <div class="exam-prep-divider"></div>
      <div class="exam-prep-stat">
        <div class="exam-prep-num">${fmtH(prepRecent)}</div>
        <div class="exam-prep-label">This week</div>
      </div>
      ${isNegligent?`<div class="exam-prep-warn">LOW PREP</div>`:''}
    </div>`:'';

    // Hours logged on past exam cards
    const pastHours=!isUpcoming&&exam.subjects.length&&prepTotal>0
      ?`<div class="exam-past-hours">${fmtH(prepTotal)} studied (last 4 wks)</div>`:'';

    // Topic list checklist (collapsible, filterable)
    const topicsHTML=(()=>{
      if(!isUpcoming||!exam.topics?.length)return'';
      const checked=(state.topicProgress[exam.id]||[]);
      const pct=Math.round(checked.length/exam.topics.length*100);
      const ui=_topicUI[exam.id]||(_topicUI[exam.id]={open:false,filter:'todo'});
      const todoItems=exam.topics.map((t,i)=>({t,i,done:checked.includes(i)})).filter(x=>!x.done);
      const doneItems=exam.topics.map((t,i)=>({t,i,done:checked.includes(i)})).filter(x=>x.done);
      const visibleItems=ui.filter==='todo'?todoItems:ui.filter==='done'?doneItems:exam.topics.map((t,i)=>({t,i,done:checked.includes(i)}));
      const renderItem=({t,i,done})=>`<div class="exam-topic-item" onclick="event.stopPropagation();toggleTopic('${exam.id}',${i})">
        <div class="exam-topic-check${done?' checked':''}"></div>
        <div class="exam-topic-text${done?' checked':''}">${t}</div>
      </div>`;
      const tabs=['todo','all','done'].map(f=>{
        const count=f==='todo'?todoItems.length:f==='done'?doneItems.length:exam.topics.length;
        const active=ui.filter===f;
        return `<button class="exam-topic-tab${active?' active':''}" onclick="event.stopPropagation();_topicUI['${exam.id}'].filter='${f}';renderExams()">${f==='todo'?'To do':f==='done'?'Done':'All'} <span class="exam-topic-tab-count">${count}</span></button>`;
      }).join('');
      const listHTML=visibleItems.length
        ?`<div class="exam-topic-list">${visibleItems.map(renderItem).join('')}</div>`
        :`<div class="exam-topic-empty">${ui.filter==='todo'?'All topics covered ✓':ui.filter==='done'?'None checked yet':'No topics'}</div>`;
      return `<div class="exam-topics">
        <div class="exam-topic-header" onclick="event.stopPropagation();_topicUI['${exam.id}'].open=!_topicUI['${exam.id}'].open;renderExams()">
          <span class="exam-topic-progress-label">${checked.length}/${exam.topics.length}</span>
          <div class="exam-topic-progress-bar"><div class="exam-topic-progress-fill" style="width:${pct}%"></div></div>
          <span class="exam-topic-pct">${pct}%</span>
          <span class="exam-topic-chevron">${ui.open?'▲':'▼'}</span>
        </div>
        ${ui.open?`<div class="exam-topic-tabs">${tabs}</div>${listHTML}`:''}
      </div>`;
    })();

    const actions=isUpcoming
      ?`<div style="display:flex;gap:6px;margin-top:8px">
          <button class="exam-action-btn" onclick="openExamGradeModal('${exam.id}')">＋ Grade</button>
        </div>`
      :`<div style="display:flex;gap:6px;margin-top:8px">
          <button class="exam-action-btn" onclick="openExamGradeModal('${exam.id}')">✎ Edit</button>
          <button class="exam-action-btn red" onclick="unarchiveExam('${exam.id}')">↺ Unarchive</button>
        </div>`;

    return `<div class="exam-card ${isUpcoming?'upcoming':'past'}">
      ${leftCol}
      <div class="exam-body">
        <div class="exam-name">${exam.name||'Untitled'}</div>
        <div class="exam-date">${fmtDate(exam.date)}</div>
        ${tagsHTML?`<div class="exam-tags">${tagsHTML}</div>`:''}
        ${pastHours}
        ${prepRow}
        ${topicsHTML}
        ${actions}
      </div>
    </div>`;
  }

  // Sort upcoming by date ascending — closest first
  const upcomingSorted=[...upcoming].sort((a,b)=>(countdown(a.date)??999)-(countdown(b.date)??999));

  let html='';
  if(upcomingSorted.length){
    html+=`<div class="exam-section-label">Upcoming</div>`;
    html+=upcomingSorted.map(examCard).join('');
  }
  if(past.length){
    html+=`<div class="exam-section-label">Past</div>`;
    html+=past.map(examCard).join('');
  }
  if(!upcoming.length&&!past.length){
    html=`<div style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:12px;">No exams</div>`;
  }

  const todayStr=localToday();
  const dueCount=lecturesPending(todayStr);  // both tracks, so the badge matches the panel
  let dueBadge='';
  if(dueCount>0)dueBadge=`<span class="lec-badge">${dueCount}</span>`;
  const switcher=`<div style="display:flex;gap:4px;padding:14px 16px 4px;">
    <button class="sil-toggle-btn${examSubTab==='exams'?' active':''}" onclick="setExamSubTab('exams')" style="flex:1;text-align:center">Exams</button>
    <button class="sil-toggle-btn${examSubTab==='lectures'?' active':''}" onclick="setExamSubTab('lectures')" style="flex:1;text-align:center">Lectures${dueBadge}</button>
  </div>`;

  el.innerHTML=switcher+(examSubTab==='lectures'?renderLecturesPanel(todayStr):html);
}

// One actionable card. Same three buttons on both tracks — rating a first-pass
// lecture is what moves it onto the spaced schedule.
function lectureCard(l,today,meta){
  const c=courseOf(l.courseId);
  let subLine='';
  if(l.sub)subLine=`<div class="lec-sub">${esc(l.sub)}</div>`;
  return `<div class="lec-card">
    <div class="lec-card-top">
      <div style="min-width:0">
        <div class="lec-title">${esc(l.t)}</div>
        <div class="lec-meta">${esc(c.short)} · ${meta}</div>
      </div>

    </div>

    <div class="lec-btns">

      <button class="lec-btn lec-solid" onclick="reviewLecture('${l.courseId}',${l.idx},3)">Solid</button>
    </div>
  </div>`;
}

function renderLecturesPanel(today){
  const look=lecturesToLookOver(today);
  const due=lecturesDue(today);
  let h='<div style="padding:4px 16px 24px">';

  // ── 1. First pass: happened, never studied ───────────────────────────────
  if(look.length){
    h+=`<div class="exam-section-label">To look over · ${look.length}</div>`;
    look.forEach(l=>{
      const days=Math.round((new Date(today+'T00:00:00')-new Date(l.d+'T00:00:00'))/86400000);
      let when='today';
      if(days===1)when='yesterday';
      else if(days>1)when=days+'d ago';
      h+=lectureCard(l,today,`lecture ${when} · not studied yet`);
    });
  }

  // ── 2. Spaced review: studied before, interval is up ─────────────────────
  if(due.length){
    h+=`<div class="exam-section-label"${look.length?' style="margin-top:18px"':''}>Due for review · ${due.length}</div>`;
    due.forEach(l=>{
      const overdue=Math.round((new Date(today+'T00:00:00')-new Date(l.due+'T00:00:00'))/86400000);
      let when='today';
      if(overdue===1)when='1 day late';
      else if(overdue>1)when=overdue+' days late';
      h+=lectureCard(l,today,`${when} · ${l.reviews} review${l.reviews>1?'s':''}`);
    });
  }

  if(!look.length&&!due.length){
    h+=`<div style="text-align:center;padding:26px 12px;color:var(--text-dim);font-size:11px">All caught up. ✓</div>`;
  }

  // ── Per-course progress (collapsed by default — the top two lists are the job) ──
  const openCls=lecturesCoursesOpen?' open':'';
  h+=`<div class="lec-toggle${openCls}" onclick="toggleLectureCourses()" style="margin-top:22px">
    <span>Courses &amp; progress</span><span class="lec-chev">${lecturesCoursesOpen?'▾':'▸'}</span>
  </div>`;
  if(!lecturesCoursesOpen){h+='</div>';return h;}
  LECTURE_COURSES.forEach(c=>{
    const arr=(state.lectures?.[c.id])||[];
    // Progress is measured against lectures that have actually happened — a
    // pre-loaded syllabus shouldn't read as 0% of 14 on day one.
    const held=arr.filter(l=>isDelivered(l,today));
    const planned=arr.filter(isPlanned).length;
    const upcoming=arr.length-held.length-planned;
    const total=held.length;
    // "Solid" = reached box 3+, i.e. survived several spaced reviews.
    const solid=held.filter(l=>(l.box??0)>=3).length;
    const dueHere=held.filter(l=>l.due&&l.due<=today).length;
    const pct=total?Math.round(solid/total*100):0;
    let dueTag='';
    if(dueHere>0)dueTag=`<span style="color:var(--gold)">${dueHere} due</span> · `;
    let upcomingTag='';
    if(upcoming>0)upcomingTag=` · ${upcoming} upcoming`;
    if(planned>0)upcomingTag+=` · ${planned} planned`;
    h+=`<div class="lec-course">
      <div class="lec-course-top">
        <span class="lec-course-name">${esc(c.name)}</span>
        <span class="lec-course-meta">${dueTag}${solid}/${total} solid${upcomingTag}</span>
      </div>
      <div class="lec-bar"><div class="lec-bar-fill" style="width:${pct}%"></div></div>
      <div class="lec-add-row">
        <input class="lec-add-inp" id="lec-add-${c.id}" placeholder="Add ${esc(c.day)} lecture…" onkeydown="if(event.key==='Enter')addLecture('${c.id}')">
        <button class="lec-add-btn" onclick="addLecture('${c.id}')">+</button>
      </div>`;
    if(arr.length){
      h+='<div class="lec-list">';
      // Dated lectures run chronologically; planned topics keep syllabus order below them.
      arr.map((l,i)=>({...l,i})).sort((a,b)=>{
        if(isPlanned(a)!==isPlanned(b))return isPlanned(a)?1:-1;
        if(isPlanned(a))return a.i-b.i;
        return (a.d||'').localeCompare(b.d||'');
      }).forEach(l=>{
        const held=isDelivered(l,today);
        const plan=isPlanned(l);
        const isDue=held&&l.due&&l.due<=today;
        let cls='lec-item';
        if(isDue)cls+=' due';
        if(!held)cls+=' upcoming';
        // Planned rows offer a Held button; dated ones show their date or next review.
        let right='—';
        if(plan)right=`<span class="lec-held-btn" onclick="markHeld('${c.id}',${l.i})">Held</span>`;
        else if(!held)right=(l.d||'').slice(5);
        else if(l.due)right='→ '+l.due.slice(5);
        const who=l.by?` · ${esc(l.by)}`:'';
        h+=`<div class="${cls}">
          <span class="lec-item-t">${esc(l.t)}${who}</span>
          <span class="lec-item-d">${right}</span>
          <span class="lec-item-x" onclick="deleteLecture('${c.id}',${l.i})">✕</span>
        </div>`;
      });
      h+='</div>';
    }
    h+='</div>';
  });

  h+='</div>';
  return h;
}

// Count-up animation
function countUp(el,to,dur=700){
  if(!el||to<=0)return;
  const start=performance.now();
  const tick=now=>{
    const p=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(e*to);
    if(p<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// Tap ripple
document.addEventListener('touchstart',e=>{
  const card=e.target.closest('.muscle-card,.streak-card,.session-card,.exam-card,.task-item');
  if(!card)return;
  const r=document.createElement('div');
  r.className='ripple';
  const rect=card.getBoundingClientRect(),t=e.touches[0];
  const sz=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${sz}px;height:${sz}px;left:${t.clientX-rect.left-sz/2}px;top:${t.clientY-rect.top-sz/2}px`;
  card.appendChild(r);
  setTimeout(()=>r.remove(),560);
},{passive:true});

(()=>{const n=document.getElementById('loadPct');const b=document.getElementById('loadBarFill');if(n)n.textContent='1%';if(b)b.style.width='1%';})();
// Show pomo screen instantly before Notion loads (wrapped so a throw can't kill refresh)
try{if(pomoMode)renderHome();}catch(e){warn('initialRenderHome',e);}
document.querySelectorAll('.tab-panel').forEach((p,i)=>{if(i>0)p.style.display='none';});
(function initGlowOrbs(){
  const positions=[
    {top:'5%',left:'10%',size:320},{top:'55%',right:'8%',size:280},
    {top:'30%',left:'50%',size:200},{top:'80%',left:'20%',size:240},
  ];
  positions.forEach((pos,i)=>{
    const o=document.createElement('div');
    o.className='glow-orb';
    const dur=9+i*2.5;
    const delay=-(i*3.1);
    o.style.cssText=`width:${pos.size}px;height:${pos.size}px;top:${pos.top||'auto'};left:${pos.left||'auto'};right:${pos.right||'auto'};bottom:${pos.bottom||'auto'};animation-duration:${dur}s;animation-delay:${delay}s;`;
    document.body.appendChild(o);
  });
})();

renderTzBtn();
refresh().catch(e=>{
  const lbl=document.getElementById('loadSublabel');
  const btn=document.getElementById('loadRetryBtn');
  if(lbl)lbl.textContent='Failed to load — '+e.message;
  if(btn)btn.style.display='block';
});

// ── Sidebar clock ──
function updateSidebarClock(){
  const el=document.getElementById('sidebar-clock');
  if(!el||window.innerWidth<900)return;
  const now=new Date();
  const timeStr=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:userTimezone});
  const dateStr=now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:userTimezone});
  el.innerHTML='<div class="sidebar-clock-time">'+timeStr+'</div><div class="sidebar-clock-date">'+dateStr+'</div>';
}
updateSidebarClock();
setInterval(updateSidebarClock,1000);

// Re-render home on resize so grid breakpoint responds
let _lastGridMode=window.innerWidth>=900;
window.addEventListener('resize',function(){
  const isWide=window.innerWidth>=900;
  updateSidebarClock();
  updateSidebarSession();
  if(isWide!==_lastGridMode){_lastGridMode=isWide;if(currentTab==='home')renderHome();}
});
// Re-render after overlay fades (initial width may be wrong during preload)
setTimeout(()=>{if(currentTab==='home')renderHome();},1200);

// ── Sidebar active session ──
function updateSidebarSession(){
  const el=document.getElementById('sidebar-session');
  if(!el||window.innerWidth<900){return;}
  if(state.activeSession){
    const elapsed=formatDuration(pomoMode&&pomoPhaseEnd?Math.max(0,pomoPhaseEnd-Date.now()):Date.now()-new Date(state.activeSession.startedAt).getTime());
    el.style.display='block';
    el.innerHTML='<div class="sidebar-session-label">'+(pomoMode?'Pomodoro':'Live session')+'</div>'
      +'<div class="sidebar-session-timer" id="sidebar-timer-display">'+elapsed+'</div>'
      +'<div class="sidebar-session-subject">'+state.activeSession.subject+'</div>';
  } else if(pomoMode&&pomoPhaseEnd&&Date.now()<pomoPhaseEnd){
    const rem=formatDuration(Math.max(0,pomoPhaseEnd-Date.now()));
    el.style.display='block';
    el.innerHTML='<div class="sidebar-session-label">Break</div>'
      +'<div class="sidebar-session-timer" id="sidebar-timer-display">'+rem+'</div>'
      +'<div class="sidebar-session-subject" style="color:var(--green-text)">Rest up</div>';
  } else {
    el.style.display='none';
  }
}
setInterval(updateSidebarSession,2000);

// ── Keyboard shortcuts ──
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmdPalette();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const map={h:'home',t:'tasks',w:'workout',e:'exams',s:'study',j:'journal'};
  const tab=map[e.key.toLowerCase()];
  if(tab){
    const btn=[...document.querySelectorAll('.nav-btn')].find(b=>b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+tab+"'"));
    switchTab(tab,btn);
  }
});

// ── Command palette ──
const CMD_ACTIONS=[
  {icon:'⌂',label:'Go to Home',hint:'H',action:()=>{const b=document.querySelector('.nav-btn');switchTab('home',b);}},
  {icon:'☰',label:'Go to Tasks',hint:'T',action:()=>{const b=[...document.querySelectorAll('.nav-btn')][1];switchTab('tasks',b);}},
  {icon:'⊕',label:'Go to Workout',hint:'W',action:()=>{const b=[...document.querySelectorAll('.nav-btn')][2];switchTab('workout',b);}},
  {icon:'✦',label:'Go to Exams',hint:'E',action:()=>{const b=[...document.querySelectorAll('.nav-btn')][3];switchTab('exams',b);}},
  {icon:'◈',label:'Go to Study',hint:'S',action:()=>{const b=[...document.querySelectorAll('.nav-btn')][4];switchTab('study',b);}},
  {icon:'✎',label:'Go to Journal',hint:'J',action:()=>{const b=[...document.querySelectorAll('.nav-btn')][5];switchTab('journal',b);}},
  {icon:'◉',label:'Go to Arcs',hint:'',action:()=>{const b=[...document.querySelectorAll('.nav-btn')][6];switchTab('arcs',b);}},
  {icon:'▸',label:'Start Study Session',hint:'',action:()=>{const b=document.querySelector('.nav-btn');switchTab('home',b);setTimeout(()=>{const btn=document.querySelector('.study-start-btn');if(btn)btn.click();},200);}},
  {icon:'■',label:'Stop Session',hint:'',action:()=>{if(state.activeSession)stopSession();}},
  {icon:'↺',label:'Sync',hint:'',action:()=>refresh(true)},
  {icon:'⏱',label:'Switch Timezone',hint:'',action:()=>openTzSheet()},
];
let cmdSelectedIdx=0;
function openCmdPalette(){
  if(document.getElementById('cmd-palette-overlay'))return;
  cmdSelectedIdx=0;
  const overlay=document.createElement('div');
  overlay.id='cmd-palette-overlay';
  overlay.onclick=e=>{if(e.target===overlay)closeCmdPalette();};
  overlay.innerHTML='<div id="cmd-palette"><input id="cmd-input" placeholder="Search actions…" autocomplete="off" spellcheck="false"/><div id="cmd-list"></div></div>';
  document.body.appendChild(overlay);
  const input=document.getElementById('cmd-input');
  input.focus();
  renderCmdList('');
  input.addEventListener('input',()=>renderCmdList(input.value));
  input.addEventListener('keydown',function(e){
    const items=document.querySelectorAll('.cmd-item');
    if(e.key==='ArrowDown'){e.preventDefault();cmdSelectedIdx=(cmdSelectedIdx+1)%items.length;updateCmdSelection();}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdSelectedIdx=(cmdSelectedIdx-1+items.length)%items.length;updateCmdSelection();}
    else if(e.key==='Enter'){e.preventDefault();items[cmdSelectedIdx]&&items[cmdSelectedIdx].click();}
    else if(e.key==='Escape'){closeCmdPalette();}
  });
}
function renderCmdList(q){
  const list=document.getElementById('cmd-list');
  if(!list)return;
  const filtered=CMD_ACTIONS.filter(a=>a.label.toLowerCase().includes(q.toLowerCase()));
  cmdSelectedIdx=0;
  list.innerHTML=filtered.map((a,i)=>'<div class="cmd-item'+(i===0?' selected':'')+'" onclick="('+a.action.toString()+')();closeCmdPalette()">'
    +'<span class="cmd-item-icon">'+a.icon+'</span>'
    +'<span>'+a.label+'</span>'
    +(a.hint?'<span class="cmd-item-hint">'+a.hint+'</span>':'')
    +'</div>').join('');
}
function updateCmdSelection(){
  document.querySelectorAll('.cmd-item').forEach((el,i)=>el.classList.toggle('selected',i===cmdSelectedIdx));
  const sel=document.querySelectorAll('.cmd-item')[cmdSelectedIdx];
  if(sel)sel.scrollIntoView({block:'nearest'});
}
function closeCmdPalette(){
  const el=document.getElementById('cmd-palette-overlay');
  if(el)el.remove();
}
</script>
